<!-- AI 对话采集页 — 聊天式 UI -->
<div class="fade-in">
    <!-- AI 未配置横幅 -->
    <div id="conv-banner" class="hidden mb-4 px-4 py-3 rounded-lg bg-amber-50 border text-sm text-amber-700 inline-flex items-center gap-1.5" style="border-color:#fde68a;">
        <svg class="icon icon--sm flex-shrink-0"><use href="#icon-alert-triangle"/></svg> 尚未配置 AI 服务。请先到 <a href="#/settings" class="text-indigo-500 underline font-medium">系统设置</a> 配置 LLM 后，回来重新开始对话。
    </div>

    <!-- 首问生成失败横幅（已配置但 AI 首次提问失败，可重试） -->
    <div id="conv-retry-banner" class="hidden mb-4 px-4 py-3 rounded-lg bg-amber-50 border text-sm text-amber-700 inline-flex items-center gap-1.5" style="border-color:#fde68a;">
        <svg class="icon icon--sm flex-shrink-0"><use href="#icon-alert-triangle"/></svg> AI 首次提问生成失败。<button onclick="retryFirstQuestion()" class="text-indigo-500 underline font-medium ml-1">重新生成首问</button>
    </div>

    <div class="panel flex flex-col" style="height:calc(100vh - 190px); padding:0; overflow:hidden;">
        <!-- 顶栏 -->
        <div class="flex items-center justify-between px-5 py-3 border-b" style="border-color:var(--border-soft);">
            <div>
                <div class="font-semibold text-gray-800 text-sm" id="conv-title">AI 学情采集</div>
                <div class="text-xs text-gray-400 mt-0.5" id="conv-subtitle">正在加载...</div>
            </div>
            <button id="conv-end-btn" onclick="endConversation()" class="btn-outline" style="padding:6px 16px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-stop-circle"/></svg> 提前结束</button>
        </div>

        <!-- 消息区 -->
        <div id="conv-messages" class="flex-1 overflow-y-auto px-5 py-4" style="background:var(--surface-hover);"></div>

        <!-- AI 认为信息已足够 → 结束建议条 -->
        <div id="conv-end-suggest" class="hidden px-5 py-2.5 text-xs flex items-center justify-between" style="background:#EDEBFE; border-top:1px solid #D6D2FB;">
            <span class="text-indigo-600 inline-flex items-center gap-1.5"><svg class="icon icon--md"><use href="#icon-bot"/></svg> AI 认为信息已足够，可以结束对话并生成学情总结</span>
            <button onclick="endConversation()" class="btn-primary" style="padding:5px 14px;font-size:12px;">结束对话</button>
        </div>

        <!-- 输入区 -->
        <div id="conv-input-area" class="flex items-center gap-2 px-5 py-3 border-t" style="border-color:var(--border-soft);">
            <input id="conv-input" class="flex-1" maxlength="2000" style="border-radius:9999px; padding:9px 18px;"
                placeholder="输入学生信息，回车发送...（最多 2000 字）" onkeydown="onInputKeydown(event)">
            <button id="conv-send-btn" onclick="sendMessage()" class="btn-primary" style="border-radius:9999px; padding:9px 24px; background:linear-gradient(135deg,#6C5CE7,#5A4BD1);">发送</button>
        </div>
    </div>
</div>

<script>
(function () {
const subjectId = parseInt(location.hash.split('/')[2]);
const state = {
    conversationId: null,
    messages: [],
    status: 'in_progress',
    configured: false,
    sending: false,
    subjectName: '',
    studentId: null,
    // 结束建议条是否已出现过（一旦出现过就保持显示，用户补充信息时不再消失）
    endSuggestedOnce: false,
};

/* ---------- 渲染 ---------- */
function scrollToBottom() {
    const box = document.getElementById('conv-messages');
    box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
}

function renderBubble(m) {
    const isAi = m.role === 'ai';
    const time = (m.time && typeof m.time === 'string' && m.time.length >= 16)
        ? m.time.slice(11, 16)  // ISO "2026-08-02T13:02:..." → "13:02"
        : '';
    const row = document.createElement('div');
    row.className = `conv-msg-row ${isAi ? 'conv-msg-ai' : 'conv-msg-user'}`;
    const avatar = `<div class="conv-avatar ${isAi ? 'ai' : 'user'}">${isAi ? '<svg class="icon"><use href="#icon-bot"/></svg>' : '<svg class="icon"><use href="#icon-user"/></svg>'}</div>`;
    const body = `<div class="conv-msg-body">` +
        `<div class="conv-bubble ${isAi ? 'ai' : 'user'}">${Utils.escapeHtml(m.content || '')}</div>` +
        (time ? `<div class="conv-msg-time">${time}</div>` : '') +
        `</div>`;
    row.innerHTML = isAi ? avatar + body : body + avatar;
    return row;
}

// 页面是否仍挂载（导航走后旧异步不再操作已卸载 DOM）
function pageAlive() { return !!document.getElementById('conv-messages'); }

function renderMessages() {
    const container = document.getElementById('conv-messages');
    if (!container) return;  // 已导航走，放弃渲染
    container.innerHTML = '';
    state.messages.forEach(m => container.appendChild(renderBubble(m)));
    scrollToBottom();
}

function setTyping(on) {
    const container = document.getElementById('conv-messages');
    if (!container) return;  // 已导航走
    let el = document.getElementById('conv-typing');
    if (on && !el) {
        el = document.createElement('div');
        el.id = 'conv-typing';
        el.className = 'conv-msg-row conv-msg-ai';
        el.innerHTML = `<div class="conv-avatar ai"><svg class="icon"><use href="#icon-bot"/></svg></div>` +
            `<div class="conv-msg-body"><div class="conv-bubble ai"><span class="typing-dots">` +
            `<span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div></div>`;
        container.appendChild(el);
        scrollToBottom();
    } else if (!on && el) {
        el.remove();
    }
}

function showEndSuggest() {
    state.endSuggestedOnce = true;
    document.getElementById('conv-end-suggest').classList.remove('hidden');
}

function hideEndSuggest() {
    // 结束建议条一旦出现过就保持显示，仅真正结束时才隐藏
    if (state.endSuggestedOnce) return;
    document.getElementById('conv-end-suggest').classList.add('hidden');
}

// 历史中是否已出现收尾语（AI 判定过信息足够）——刷新后恢复建议条
function historyHasClosing() {
    return state.messages.some(m =>
        (m.role === 'ai') &&
        /信息差不多了|还有什么要补充/.test(m.content || ''));
}

function showRetryBanner() {
    document.getElementById('conv-retry-banner').classList.remove('hidden');
}

function hideRetryBanner() {
    document.getElementById('conv-retry-banner').classList.add('hidden');
}

function showUnconfiguredBanner() {
    document.getElementById('conv-banner').classList.remove('hidden');
    document.getElementById('conv-input').disabled = true;
    document.getElementById('conv-send-btn').disabled = true;
}

function showCompleted(summary) {
    state.status = 'completed';
    document.getElementById('conv-input-area').classList.add('hidden');
    document.getElementById('conv-end-suggest').classList.add('hidden');
    document.getElementById('conv-end-btn').classList.add('hidden');
    document.getElementById('conv-subtitle').textContent = '对话已结束 · 学情总结已生成';
    document.getElementById('conv-completed-footer')?.remove();
    const footer = document.createElement('div');
    footer.id = 'conv-completed-footer';
    footer.className = 'px-5 py-3 border-t flex items-center justify-between';
    footer.style.borderColor = 'var(--border-soft)';
    footer.innerHTML = `
        <div class="text-sm text-green-600 font-medium inline-flex items-center gap-1.5"><svg class="icon icon--md"><use href="#icon-check-circle"/></svg> 对话已结束，本次采集完成</div>
        <div class="flex items-center gap-2">
            <button onclick="generateReport(this)" class="btn-primary" style="padding:7px 16px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-file-text"/></svg> 生成报告</button>
            <button onclick="location.hash='#/student/${state.studentId}/subject/${subjectId}'" class="btn-outline" style="padding:7px 16px;font-size:13px;">返回学科详情</button>
        </div>
    `;
    document.querySelector('.panel').appendChild(footer);
}

/* ---------- 交互 ---------- */
async function sendMessage() {
    const input = document.getElementById('conv-input');
    const text = input.value.trim();
    if (!text || state.sending || state.status !== 'in_progress' || !state.configured) return;
    state.sending = true;
    input.value = '';
    // 乐观追加用户气泡，AI 回复前先展示
    state.messages = state.messages.concat([{ role: 'user', content: text }]);
    renderMessages();
    setTyping(true);
    try {
        const res = await API.conversations.send(subjectId, { conversation_id: state.conversationId, message: text });
        if (!res.success) throw new Error(res.error);
        const d = res.data;
        state.messages = d.messages || state.messages;
        state.status = d.status || state.status;
        renderMessages();
        // AI 认为信息足够 → 显示结束建议条；继续追问 → 隐藏（避免自相矛盾）
        if (d.should_end) showEndSuggest(); else hideEndSuggest();
    } catch (e) {
        showToast('发送失败：' + e.message, 'error');
    } finally {
        state.sending = false;
        setTyping(false);
    }
}

function onInputKeydown(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
    }
}

async function endConversation() {
    if (state.sending || state.status !== 'in_progress') return;
    Utils.confirmDialog({
        title: '结束对话',
        danger: true,
        message: '结束对话后将生成学情总结，本次对话不可继续。<br>如需再次采集需重新建档。确定结束吗？',
        onOk: async () => {
            try {
                const res = await API.conversations.end(subjectId, { conversation_id: state.conversationId });
                if (!res.success) throw new Error(res.error);
                const d = res.data;
                state.messages = d.messages || state.messages;
                renderMessages();
                showCompleted(d.summary);
            } catch (e) {
                showToast('结束失败：' + e.message, 'error');
            }
        },
    });
}

// 对话完成态 → 手动生成学情报告（P5），成功跳转报告页
// btn 通过 onclick="generateReport(this)" 传入，不依赖全局 event（避免 undefined 抛错卡死）
async function generateReport(btn) {
    if (state.sending) return;
    state.sending = true;
    btn = btn || null;
    const oldText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
    try {
        const res = await API.reports.generate(subjectId, {});
        if (!res.success) throw new Error(res.error);
        showToast('报告生成成功', 'success');
        location.hash = `#/report/${res.data.id}`;
    } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = oldText; }
        showToast('生成失败：' + e.message, 'error');
    } finally {
        state.sending = false;
    }
}

// 重试生成首问：重调 start（幂等安全：空会话+已配置才会重新生成）
async function retryFirstQuestion() {
    if (state.sending) return;
    state.sending = true;
    try {
        const res = await API.conversations.start(subjectId);
        if (!res.success) throw new Error(res.error);
        const d = res.data;
        state.conversationId = d.conversation.id;
        state.messages = d.conversation.messages || [];
        state.status = d.conversation.status;
        state.configured = d.configured;
        renderMessages();
        if (d.first_question_failed) {
            showToast('AI 仍无法生成首问，请检查 AI 配置或稍后再试', 'error');
        } else {
            hideRetryBanner();
            showToast('已生成首问，请开始对话', 'success');
        }
    } catch (e) {
        showToast('重试失败：' + e.message, 'error');
    } finally {
        state.sending = false;
    }
}

/* ---------- 初始化 ---------- */
async function initConversationPage() {
    // 1) 学科 + 学生信息（顶栏标题）
    try {
        const subRes = await API.subjects.get(subjectId);
        if (!subRes.success) throw new Error(subRes.error);
        state.subjectName = subRes.data.name;
        state.studentId = subRes.data.student_id;
        document.getElementById('conv-title').textContent = `${subRes.data.name}学科 · AI 学情采集`;
    } catch (e) {
        document.getElementById('conv-subtitle').textContent = '学科加载失败';
        return;
    }

    // 2) start（幂等：恢复进行中会话，或新建 + 生成首问）
    try {
        const res = await API.conversations.start(subjectId);
        if (!res.success) throw new Error(res.error);
        if (!pageAlive()) return;  // 等待首问生成期间已导航走，放弃渲染
        const d = res.data;
        state.conversationId = d.conversation.id;
        state.messages = d.conversation.messages || [];
        state.status = d.conversation.status;
        state.configured = d.configured;
        renderMessages();
        document.getElementById('conv-subtitle').textContent =
            d.configured ? `${d.student_name || ''} · 进行中` : 'AI 服务未配置';
        // 恢复进行中会话时，历史已收尾则重新显示结束建议条
        if (historyHasClosing()) showEndSuggest();
        if (!d.configured) showUnconfiguredBanner();
        if (d.first_question_failed) showRetryBanner();
    } catch (e) {
        if (!pageAlive()) return;
        document.getElementById('conv-subtitle').textContent = '对话初始化失败：' + e.message;
        showToast('对话初始化失败：' + e.message, 'error');
    }
}

// 注册全局刷新（顶部「↻ 刷新」/切回标签页自动调用）
// 注意：completed 状态不调 start（否则会新建空会话冲掉总结）；sending 中跳过
window.currentPageRefresh = async () => {
    if (state.sending || state.status === 'completed') return;
    const val = document.getElementById('conv-input').value;
    try {
        const res = await API.conversations.start(subjectId);
        if (!res.success) return;
        if (!pageAlive()) return;  // 刷新时已导航走
        const d = res.data;
        state.conversationId = d.conversation.id;
        state.messages = d.conversation.messages || [];
        state.status = d.conversation.status;
        state.configured = d.configured;
        renderMessages();
        document.getElementById('conv-input').value = val;
        // 刷新后根据历史恢复结束建议条（历史已收尾则保持显示），避免残留过期状态
        if (historyHasClosing()) showEndSuggest(); else hideEndSuggest();
        if (!d.configured) showUnconfiguredBanner();
        if (d.first_question_failed) showRetryBanner(); else hideRetryBanner();
    } catch (e) { /* 静默，保持当前视图 */ }
};

initConversationPage();

/* ---------- IIFE 作用域导出：供内联 onclick 调用（必须与页面 onclick 保持一致） ---------- */
Object.assign(window, {
    sendMessage, onInputKeydown, endConversation, generateReport, retryFirstQuestion,
});
})();
</script>
