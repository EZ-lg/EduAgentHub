<!-- 班级管理页 — P2：班级 CRUD + 学生增减（一对一/一对多） -->
<div class="fade-in">

    <!-- ============ 列表视图 ============ -->
    <div id="class-list-view">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5">
                <svg class="icon icon--md text-indigo-500"><use href="#icon-users"/></svg>
                班级管理 <span class="text-xs text-gray-400 font-normal" id="class-count"></span>
            </h2>
            <div class="flex gap-2 items-center flex-wrap">
                <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1" id="class-term-filter">
                    <button class="term-btn active" data-term="" onclick="setTermFilter('')" style="padding:4px 12px;font-size:12px;border-radius:6px;">全部</button>
                    <button class="term-btn" data-term="summer_winter" onclick="setTermFilter('summer_winter')" style="padding:4px 12px;font-size:12px;border-radius:6px;">寒暑假班</button>
                    <button class="term-btn" data-term="semester" onclick="setTermFilter('semester')" style="padding:4px 12px;font-size:12px;border-radius:6px;">学期跟班</button>
                </div>
                <select id="class-status-filter" onchange="loadClasses()" class="text-sm border rounded-lg py-1.5 px-2" style="border-color:var(--border);">
                    <option value="">全部状态</option>
                    <option value="active">在读</option>
                    <option value="paused">已停用</option>
                </select>
                <button onclick="showClassModal()" class="btn-primary" style="padding:6px 16px;font-size:13px;">
                    <svg class="icon icon--md"><use href="#icon-plus"/></svg> 新建班级
                </button>
            </div>
        </div>

        <div class="panel">
            <div class="text-center py-10 text-gray-300" id="classes-loading">加载中...</div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden" id="classes-grid"></div>
            <div class="hidden" id="classes-empty">
                <div class="empty-state">
                    <div class="empty-icon"><svg class="icon"><use href="#icon-users"/></svg></div>
                    <div class="empty-title">暂无班级</div>
                    <div class="empty-desc">点击右上角「新建班级」创建。一对一 = 班内 1 人，一对多 = 小班教学</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 详情视图 ============ -->
    <div id="class-detail-view" class="hidden">
        <div class="flex items-center gap-3 mb-4">
            <button onclick="location.hash='#/classes'" class="btn-outline" style="padding:6px 12px;font-size:13px;">
                <svg class="icon icon--md"><use href="#icon-arrow-left"/></svg> 返回
            </button>
            <h2 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5" id="detail-title">班级详情</h2>
        </div>

        <!-- 班级信息卡 -->
        <div class="panel mb-4">
            <div class="flex items-start justify-between flex-wrap gap-2 mb-3">
                <div class="flex items-center gap-3">
                    <div class="text-lg font-bold text-gray-800" id="detail-name"></div>
                    <span class="badge badge--info" id="detail-type"></span>
                    <span class="badge" id="detail-status"></span>
                </div>
                <div class="flex gap-2">
                    <button onclick="showClassModal(currentClassId)" class="btn-outline" style="padding:6px 14px;font-size:13px;">
                        <svg class="icon icon--md"><use href="#icon-edit-3"/></svg> 编辑
                    </button>
                    <button onclick="toggleClassStatus(currentClassId)" class="btn-outline" style="padding:6px 14px;font-size:13px;" id="btn-toggle-status">
                        <svg class="icon icon--md"><use href="#icon-pause"/></svg> 停用
                    </button>
                    <button onclick="deleteClass(currentClassId)" class="btn-outline" style="padding:6px 14px;font-size:13px;color:#dc2626;border-color:#fecaca;">
                        <svg class="icon icon--md"><use href="#icon-trash-2"/></svg> 删除
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm" id="detail-meta"></div>
            <div id="detail-notes" class="mt-3 text-sm text-gray-500"></div>
        </div>

        <!-- 学生区 -->
        <div class="panel mb-4">
            <div class="flex items-center justify-between mb-3">
                <div class="panel-title"><svg class="icon"><use href="#icon-user-check"/></svg> 班级学生 <span class="text-xs font-normal text-gray-400" id="student-count"></span></div>
                <button onclick="showAddStudentModal()" class="btn-primary" style="padding:6px 14px;font-size:13px;">
                    <svg class="icon icon--md"><use href="#icon-plus"/></svg> 添加学生
                </button>
            </div>
            <div id="students-list"></div>
            <div class="text-xs text-gray-300 mt-3" id="class-type-tip"></div>
        </div>

        <!-- 上课安排（排课） -->
        <div class="panel mb-4">
            <div class="flex items-center justify-between mb-3">
                <div class="panel-title"><svg class="icon"><use href="#icon-calendar"/></svg> 上课安排 <span class="text-xs font-normal text-gray-400" id="schedule-mode-tip">每周循环课表 · 按教室/时段排课</span></div>
                <div class="flex gap-2" id="semester-actions">
                    <button onclick="showManualScheduleModal()" class="btn-outline" style="padding:6px 14px;font-size:13px;">
                        <svg class="icon icon--md"><use href="#icon-plus"/></svg> 手动加课
                    </button>
                    <button onclick="openSlotPicker()" class="btn-primary" style="padding:6px 14px;font-size:13px;">
                        <svg class="icon icon--md"><use href="#icon-calendar-check"/></svg> 查看空闲时段
                    </button>
                </div>
            </div>
            <div id="term-class-info" class="hidden mb-3"></div>
            <div id="schedule-list"></div>

            <!-- 空闲时段查看器（点空闲格 → 弹窗确认，可微调具体时间） -->
            <div id="slot-picker" class="hidden mt-3 rounded-lg border p-4" style="border-color:var(--border);background:var(--surface-hover);">
                <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
                    <div class="text-sm font-semibold text-gray-700">空闲时段查看</div>
                    <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1" id="slot-weekday-bar"></div>
                </div>
                <div class="text-xs text-gray-500 mb-2" id="slot-hint">绿色=空闲，点击在弹窗中确认（可微调具体时间）；灰底=已被占用；「本班已有课」=本班已排。<span id="slot-mode-hint"></span></div>
                <div id="slot-grid" class="overflow-x-auto"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
/* ---------- 路由参数 ---------- */
const hashParts = location.hash.split('/');
const classId = hashParts[2] ? parseInt(hashParts[2]) : null;

let currentClass = null;
let teacherList = [];
let classroomList = [];
let allStudents = [];

function esc(s) { return Utils.escapeHtml(String(s ?? '')); }

/* ---------- 基础数据加载 ---------- */
async function loadBaseData() {
    try {
        const [t, c, s] = await Promise.all([
            API.teachers.list(),
            API.classrooms.list(),
            API.students.list(),
        ]);
        teacherList = (t.success && t.data) ? t.data : [];
        classroomList = (c.success && c.data) ? c.data : [];
        // students.list 返回分页对象 {items:[...]}，兼容数组与分页两种格式
        const sdata = (s.success && s.data) ? s.data : [];
        allStudents = Array.isArray(sdata) ? sdata : (sdata.items || []);
    } catch (e) { /* 下拉数据失败不阻塞主流程 */ }
}

/* ---------- 列表视图 ---------- */
let termFilter = '';
function setTermFilter(v) {
    termFilter = v;
    document.querySelectorAll('#class-term-filter .term-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.term === v);
    });
    loadClasses();
}

async function loadClasses() {
    const grid = document.getElementById('classes-grid');
    const loading = document.getElementById('classes-loading');
    const empty = document.getElementById('classes-empty');
    const status = document.getElementById('class-status-filter').value;
    try {
        const r = await API.classes.list({ status, term_type: termFilter });
        const list = (r.success && r.data) ? r.data : [];
        document.getElementById('class-count').textContent = list.length ? `（${list.length} 个）` : '';
        loading.classList.add('hidden');
        if (!list.length) {
            grid.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = list.map(c => `
            <div class="border rounded-xl p-4 cursor-pointer hover:shadow-md transition-shadow" style="border-color:var(--border);background:#fff;" onclick="openClassDetail(${c.id})">
                <div class="flex items-start justify-between gap-2">
                    <div class="font-semibold text-gray-800 text-sm">${esc(c.name)}</div>
                    <div class="flex flex-col items-end gap-1 flex-shrink-0">
                        <div class="flex gap-1">
                            <span class="badge ${c.term_type === 'summer_winter' ? 'badge--warning' : 'badge'}">${c.term_type === 'summer_winter' ? '寒暑假班' : '学期跟班'}</span>
                            <span class="badge ${c.class_type === '1v1' ? 'badge--info' : 'badge--info'}">${c.class_type === '1v1' ? '一对一' : '小班'}</span>
                        </div>
                        ${c.status === 'active'
                            ? '<span class="badge" style="background:#ecfdf5;color:#059669;border-color:#a7f3d0;">在读</span>'
                            : '<span class="badge" style="background:var(--border-soft);color:#64748b;border-color:var(--border);">已停用</span>'}
                    </div>
                </div>
                <div class="text-xs text-gray-500 mt-3 space-y-1">
                    <div><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-book-open"/></svg> 学科：${esc(c.subject_name || '未设置')}</div>
                    <div><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-graduation-cap"/></svg> 教师：${esc(c.teacher_name || '未指派')}</div>
                    <div><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-building"/></svg> 教室：${esc(c.classroom_name || '未设置')}</div>
                </div>
                <div class="flex items-center gap-3 mt-3 pt-3 border-t text-xs text-gray-400" style="border-color:var(--border-soft);">
                    <span><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-users"/></svg> ${c.student_count} 人</span>
                    ${c.term_type === 'summer_winter'
                        ? `<span><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-calendar"/></svg> 每天 ${esc(c.daily_start)}-${esc(c.daily_end)} · ${c.total_lessons} 天</span>`
                        : `<span><svg class="icon icon--sm" style="color:var(--text-3);"><use href="#icon-calendar"/></svg> ${c.weekly_frequency} 次/周</span>`}
                </div>
            </div>`).join('');
    } catch (e) {
        loading.textContent = '加载失败：' + e.message;
    }
}

function openClassDetail(id) { location.hash = '#/classes/' + id; }

/* ---------- 详情视图 ---------- */
async function loadClassDetail() {
    try {
        const r = await API.classes.get(classId);
        if (!r.success) throw new Error(r.error || '班级不存在');
        currentClass = r.data;
    } catch (e) {
        document.getElementById('detail-title').textContent = '班级不存在';
        document.getElementById('class-list-view').classList.remove('hidden');
        document.getElementById('class-detail-view').classList.add('hidden');
        showToast('班级加载失败：' + e.message, 'error');
        return;
    }
    document.getElementById('class-list-view').classList.add('hidden');
    document.getElementById('class-detail-view').classList.remove('hidden');

    const c = currentClass;
    document.getElementById('detail-title').textContent = c.name;
    document.getElementById('detail-name').textContent = c.name;
    document.getElementById('detail-type').textContent = c.class_type === '1v1' ? '一对一' : '小班（一对多）';
    const st = document.getElementById('detail-status');
    if (c.status === 'active') {
        st.textContent = '在读'; st.style.cssText = 'background:#ecfdf5;color:#059669;border-color:#a7f3d0;';
    } else {
        st.textContent = '已停用'; st.style.cssText = 'background:var(--border-soft);color:#64748b;border-color:var(--border);';
    }
    document.getElementById('btn-toggle-status').innerHTML = c.status === 'active'
        ? '<svg class="icon icon--md"><use href="#icon-pause"/></svg> 停用'
        : '<svg class="icon icon--md"><use href="#icon-play"/></svg> 启用';

    const isTerm = c.term_type === 'summer_winter';
    document.getElementById('detail-meta').innerHTML = `
        <div><div class="text-xs text-gray-400">学科</div><div class="mt-0.5">${esc(c.subject_name || '未设置')}</div></div>
        <div><div class="text-xs text-gray-400">教师</div><div class="mt-0.5">${esc(c.teacher_name || '未指派')}</div></div>
        <div><div class="text-xs text-gray-400">教室</div><div class="mt-0.5">${esc(c.classroom_name || '未设置')}</div></div>
        ${isTerm
            ? `<div><div class="text-xs text-gray-400">每天时段</div><div class="mt-0.5">${esc(c.daily_start)}-${esc(c.daily_end)} · 共 ${c.total_lessons} 天</div></div>`
            : `<div><div class="text-xs text-gray-400">上课频率</div><div class="mt-0.5">每周 ${c.weekly_frequency} 次 · 每次 ${c.duration_minutes} 分钟</div></div>`}
        ${c.start_date ? `<div><div class="text-xs text-gray-400">开始日期</div><div class="mt-0.5">${esc(c.start_date)}</div></div>` : ''}
        ${c.end_date ? `<div><div class="text-xs text-gray-400">结束日期</div><div class="mt-0.5">${esc(c.end_date)}${isTerm ? '（第 ' + c.total_lessons + ' 个上课日）' : ''}</div></div>` : ''}
    `;
    document.getElementById('detail-notes').textContent = c.notes ? '备注：' + c.notes : '';
    document.getElementById('class-type-tip').textContent = c.class_type === '1v1'
        ? '一对一班级：最多 1 名学生（从学生学科「转为一对一班」自动创建）'
        : '小班教学：可添加多名学生，添加时已做重复报班提示，时间冲突检测将在排课阶段（P3）生效';

    renderStudents();
    // 学期班：周循环排课；寒暑假班：每天固定课 + 续课
    const isTermMode = currentClass.term_type === 'summer_winter';
    document.getElementById('semester-actions').style.display = isTermMode ? 'none' : '';
    document.getElementById('schedule-mode-tip').textContent = isTermMode ? '寒暑假班 · 每天固定 1 节 · 周日休息' : '每周循环课表 · 点「查看空闲时段」按教室/时段排课';
    if (isTermMode) renderTermClass(); else loadScheduleList();
}

function renderTermClass() {
    const c = currentClass;
    const box = document.getElementById('term-class-info');
    box.classList.remove('hidden');
    document.getElementById('schedule-list').innerHTML = '';
    box.innerHTML = `
        <div class="rounded-lg border p-3" style="border-color:var(--border);background:var(--surface-hover);">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center gap-2 flex-wrap text-sm">
                    <span class="badge badge--warning">寒暑假班</span>
                    <span class="font-medium text-gray-800">每天 ${esc(c.daily_start)}-${esc(c.daily_end)}</span>
                    <span class="text-xs text-gray-500">教室：${esc(c.classroom_name || '未设置')}</span>
                    <span class="text-xs text-gray-500">教师：${esc(c.teacher_name || '未指派')}</span>
                </div>
                <div class="flex items-center gap-3 flex-wrap">
                    <span class="text-xs text-gray-500">已排 <b class="text-gray-700 num">${c.total_lessons}</b> 天</span>
                    <span class="text-xs text-gray-500">班期：${esc(c.start_date || '?')} ~ ${esc(c.end_date || '?')}</span>
                    <button onclick="showExtendModal()" class="btn-primary" style="padding:5px 14px;font-size:12px;">
                        <svg class="icon icon--sm"><use href="#icon-plus"/></svg> 续课
                    </button>
                </div>
            </div>
            <div class="text-xs text-gray-400 mt-2">周一至周六上课，周日休息。续课默认同时段追加天数；若续课后该时段已被其他班占用，需重新排课。</div>
        </div>`;
}

function showExtendModal() {
    const c = currentClass;
    Utils.showModal({
        title: '班级续课',
        subtitle: `当前 ${c.total_lessons} 天，至 ${c.end_date}。输入新的总课次（天数），须大于当前天数；默认同时段续课、日期顺延。`,
        width: 440,
        fields: [
            { key: 'new_total', label: `续课后总课次（当前 ${c.total_lessons} 天，须 > ${c.total_lessons}）`, type: 'number', min: c.total_lessons + 1, default: c.total_lessons + 5, required: true },
        ],
        onSubmit: async (data) => {
            const newTotal = Number(data.new_total);
            if (!newTotal || newTotal <= c.total_lessons) {
                showToast(`请输入大于 ${c.total_lessons} 的天数`, 'error');
                return;
            }
            try {
                const r = await API.classes.extend(c.id, { new_total: newTotal });
                if (r.success && r.data.extended) {
                    showToast(`续课成功：${c.name} 已续至 ${newTotal} 天（结束 ${r.data.end_date}）`, 'success');
                    const fresh = await API.classes.get(c.id);
                    currentClass = fresh.data;
                    loadClassDetail();
                } else {
                    const conflicts = (r.data && r.data.conflicts) || [];
                    const msg = conflicts.length ? `续课冲突：${conflicts[0].message}` : ((r.data && r.data.message) || '续课失败');
                    showToast(msg, 'error');
                    if (conflicts.length) {
                        Utils.showModal({
                            title: '续课冲突',
                            bodyHtml: `<div class="text-sm text-gray-700 mb-1">新增日期与已有排课冲突，未执行续课：</div>`
                                + conflicts.map(cf => `<div class="text-sm text-red-500 py-1">${esc(cf.date)} · ${esc(cf.message)}</div>`).join('')
                                + '<div class="text-xs text-gray-400 mt-2">需先重新排课（调整本班时段/教室，或等待占用班结课）后再续课。</div>',
                        });
                    }
                }
            } catch (e) { showToast('续课失败：' + e.message, 'error'); }
        },
    });
}

function renderStudents() {
    const list = currentClass.students || [];
    document.getElementById('student-count').textContent = `（${list.length} 人）`;
    const box = document.getElementById('students-list');
    if (!list.length) {
        box.innerHTML = '<div class="text-center py-6 text-gray-300 text-sm">暂无学生，点击右上角「添加学生」</div>';
        return;
    }
    box.innerHTML = `<table class="w-full text-sm">
        <thead><tr>
            <th style="width:40%;">姓名</th><th style="width:20%;">年级</th>
            <th style="width:25%;">入班日期</th><th style="width:15%;">操作</th>
        </tr></thead><tbody>` + list.map(s => `
        <tr class="border-b align-top" style="border-color:var(--border-soft);">
            <td class="py-2.5 font-medium text-gray-800">${esc(s.name)}</td>
            <td class="py-2.5 text-gray-500">${esc(s.grade || '-')}</td>
            <td class="py-2.5 text-gray-500">${s.enroll_date ? Utils.formatDate(s.enroll_date, true) : '-'}</td>
            <td class="py-2.5">
                <button onclick="removeStudent(${s.student_id})" class="text-red-400 hover:text-red-600 text-xs inline-flex items-center gap-1" title="移出班级">
                    <svg class="icon icon--sm"><use href="#icon-user-x"/></svg> 移除
                </button>
            </td>
        </tr>`).join('') + `</tbody></table>`;
}

/* ---------- 新建 / 编辑班级 ---------- */
function showClassModal(id) {
    const isEdit = !!id;
    let values = {};
    if (isEdit && currentClass) {
        const c = currentClass;
        values = {
            name: c.name, subject_name: c.subject_name, class_type: c.class_type,
            term_type: c.term_type || 'semester',
            teacher_id: c.teacher_id ? String(c.teacher_id) : '', classroom_id: c.classroom_id ? String(c.classroom_id) : '',
            weekly_frequency: c.weekly_frequency, duration_minutes: c.duration_minutes,
            start_date: c.start_date, end_date: c.end_date, notes: c.notes,
            total_lessons: c.total_lessons, daily_start: c.daily_start, daily_end: c.daily_end,
        };
    }
    Utils.showModal({
        title: isEdit ? '编辑班级' : '新建班级',
        subtitle: isEdit ? '修改班级信息' : '创建上课班级 · 学期跟班（每周循环）或 寒暑假班（每天固定 1 节，周日休息）',
        width: 600,
        columns: 2,
        fields: [
            { key: 'name', label: '班级名称', required: true, placeholder: '如：初二数学冲刺班', section: '基本信息', full: true },
            { key: 'class_type', label: '班型', type: 'select', options: [{ v: '1vN', label: '一对多（小班）' }, { v: '1v1', label: '一对一' }], section: '基本信息' },
            { key: 'term_type', label: '上课模式', type: 'select', options: [{ v: 'semester', label: '学期跟班（每周固定课次）' }, { v: 'summer_winter', label: '寒暑假班（每天固定1节·周日休息）' }], section: '基本信息' },
            { key: 'subject_name', label: '学科', type: 'select', options: Utils.subjectPresets, section: '基本信息' },
            { key: 'teacher_id', label: '教师', type: 'select', options: teacherList.map(t => ({ v: t.id, label: t.name })), section: '基本信息' },
            { key: 'classroom_id', label: '教室', type: 'select', options: classroomList.filter(c => c.status === 'active').map(c => ({ v: c.id, label: c.name + (c.location ? '（' + c.location + '）' : '') })), section: '基本信息' },
            // 学期跟班（仅 term_type=semester 时显示）
            { key: 'weekly_frequency', label: '每周课次', type: 'number', min: 1, default: 2, section: '学期跟班', showWhen: { key: 'term_type', value: 'semester' } },
            { key: 'duration_minutes', label: '每次时长(分)', type: 'number', min: 30, default: 120, section: '学期跟班', showWhen: { key: 'term_type', value: 'semester' } },
            { key: 'start_date', label: '开始日期', type: 'date', section: '学期跟班', showWhen: { key: 'term_type', value: 'semester' } },
            { key: 'end_date', label: '结束日期', type: 'date', section: '学期跟班', showWhen: { key: 'term_type', value: 'semester' } },
            // 寒暑假班（仅 term_type=summer_winter 时显示，每天具体时间可自定义）
            { key: 'daily_start', label: '每天开始时间', type: 'time', default: '09:00', section: '寒暑假班', showWhen: { key: 'term_type', value: 'summer_winter' } },
            { key: 'daily_end', label: '每天结束时间', type: 'time', default: '10:30', section: '寒暑假班', showWhen: { key: 'term_type', value: 'summer_winter' } },
            { key: 'sw_start_date', label: '开班日期', type: 'date', section: '寒暑假班', showWhen: { key: 'term_type', value: 'summer_winter' } },
            { key: 'total_lessons', label: '总课次（天数）', type: 'number', min: 1, default: 15, section: '寒暑假班', showWhen: { key: 'term_type', value: 'summer_winter' } },
            { key: 'notes', label: '备注', type: 'textarea', rows: 2, placeholder: '选填', section: '其他', full: true },
        ],
        renderOn: ['term_type'],
        values: {
            ...values,
            daily_start: values.daily_start || '09:00',
            daily_end: values.daily_end || '10:30',
            sw_start_date: values.start_date || '',
        },
        onSubmit: async (data) => {
            data.teacher_id = data.teacher_id ? Number(data.teacher_id) : null;
            data.classroom_id = data.classroom_id ? Number(data.classroom_id) : null;
            if (data.term_type === 'summer_winter') {
                if (!data.daily_start || !data.daily_end || toMin(data.daily_end) <= toMin(data.daily_start)) {
                    showToast('请填写每天开始/结束时间（结束需晚于开始）', 'error');
                    return;
                }
                data.start_date = data.sw_start_date;
                data.total_lessons = Number(data.total_lessons || 0);
                delete data.sw_start_date;
            } else {
                // 学期班：清空寒暑假字段，避免遗留脏数据
                data.daily_start = ''; data.daily_end = ''; data.total_lessons = 0;
                data.weekly_frequency = Number(data.weekly_frequency || 1);
            }
            try {
                const r = isEdit
                    ? await API.classes.update(id, data)
                    : await API.classes.create(data);
                if (r.success) {
                    showToast(isEdit ? '班级已更新' : '班级已创建', 'success');
                    if (isEdit) { currentClass = r.data; loadClassDetail(); }
                    else { location.hash = '#/classes/' + r.data.id; }
                } else {
                    // 业务失败（success=false 且非 HTTPException），弹窗提示
                    const detail = r.error || '未知错误';
                    const msg = typeof detail === 'object' ? (detail.message || '保存失败') : ('保存失败：' + detail);
                    showClassErrorModal(msg);
                }
            } catch (e) {
                // 后端 400：detail 为 {message, conflicts}（班期冲突）或字符串（校验错误），一律弹窗明确展示
                const d = e.detail || null;
                if (d && d.conflicts && d.conflicts.length) {
                    const mapped = (d.conflicts || []).map(c => ({
                        type: c.type,
                        time: c.date || '',
                        message: c.message || '冲突',
                    }));
                    showConflictModal(mapped, d.message || '班期冲突');
                } else {
                    showClassErrorModal(d && d.message ? d.message : e.message);
                }
            }
        },
    });
}

// 学期班只看周末（周六/周日）；寒暑假班看周一~周六
function slotDays() {
    return currentClass.term_type === 'summer_winter' ? [0, 1, 2, 3, 4, 5] : [5, 6];
}

function openSlotPicker() {

    if (!sp) return;
    sp.classList.toggle('hidden');
    if (sp.classList.contains('hidden')) return;
    slotWeekday = slotDays()[0];   // 学期班默认周六，寒暑假默认周一

        hint.textContent = currentClass.term_type === 'summer_winter'
            ? '寒暑假班看周一~周六：确定后按班期每天固定 1 节、周日休息。'

    }

function renderSlotWeekdayBar() {
    document.getElementById('slot-weekday-bar').innerHTML = slotDays().map(wd => `
        <button class="term-btn ${wd === slotWeekday ? 'active' : ''}" data-wd="${wd}" onclick="selectSlotWeekday(${wd})" style="padding:4px 12px;font-size:12px;border-radius:6px;">${WEEK_NAMES[wd]}</button>`).join('');
}

// 未来第一个是 wd（0=周一）的日期，用于 day 接口解析该星期天的占用（学期班按周几 + 班期内寒暑假班）
function nextDateOfWeekday(wd) {
    const now = new Date();
    const todayJs = now.getDay() === 0 ? 7 : now.getDay();  // JS 周日=0 → 转 7
    const target = wd + 1;                                    // 周一=1 ... 周日=7
    const diff = (target - todayJs + 7) % 7;
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
}

function toMin(t) { const [h, m] = String(t || '').split(':'); return (+h || 0) * 60 + (+m || 0); }
function overlap(a1, a2, b1, b2) { return toMin(a1) < toMin(b2) && toMin(b1) < toMin(a2); }

// 班级保存失败（非冲突）也用弹窗提示原因，避免只有容易错过的 toast
function showClassErrorModal(msg) {
    Utils.showModal({
        title: '保存失败',
        hideOk: true,
        bodyHtml: `<div class="text-sm text-red-600" style="white-space:pre-wrap;">${esc(msg || '未知错误，请检查填写内容')}</div>
                   <div class="mt-3 text-xs text-gray-400">（如需继续修改，请重新打开新建/编辑窗口）</div>`,
    });
}

// 排课冲突弹窗：明确显示哪一天哪节课和哪个班级冲突
function showConflictModal(conflicts, title = '排课冲突') {
    const list = (conflicts || []).map(c => `
        <div class="flex items-start gap-2 py-1.5 border-b text-sm" style="border-color:var(--border-soft);">
            <span class="badge ${c.type === 'classroom' ? 'badge--danger' : (c.type === 'teacher' ? 'badge--warning' : 'badge--neutral')} shrink-0">${c.type === 'classroom' ? '教室' : c.type === 'teacher' ? '教师' : '学生'}</span>
            <span class="text-gray-700">${esc(c.time || '')}：${esc(c.message || '冲突')}</span>
        </div>`).join('');
    Utils.showModal({
        title,
        bodyHtml: `<div class="text-sm text-gray-600 mb-2">该排课未保存，与以下安排冲突：</div>${list || '<div class="text-sm text-gray-400">未知冲突</div>'}`,
    });
}

async function selectSlotWeekday(wd) {
    slotWeekday = wd;
    document.querySelectorAll('#slot-weekday-bar .term-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.wd) === wd));
    const grid = document.getElementById('slot-grid');
    if (!grid) return;
    grid.innerHTML = '<div class="text-center py-4 text-gray-400 text-sm">加载中...</div>';
    try {
        const date = nextDateOfWeekday(wd);
        const [dayRes, periodRes] = await Promise.all([API.schedules.day(date), API.schedules.periods()]);
        const items = (dayRes.success && dayRes.data && dayRes.data.items) ? dayRes.data.items : [];
        const periodList = (periodRes.success && periodRes.data && periodRes.data.length) ? periodRes.data : DEFAULT_PERIODS;
        const rooms = classroomList.filter(c => c.status === 'active');
        if (!rooms.length) { grid.innerHTML = '<div class="text-gray-400 text-sm py-2">暂无可用教室</div>'; return; }
        // 本班 vs 其他班占用（本班寒暑假班期/周循环也来自 day 接口，class_id 相同）
        const mineItems = items.filter(it => it.class_id === currentClass.id);
        const otherItems = items.filter(it => it.class_id !== currentClass.id);
        const hits = (list, roomId, p) => list.filter(it => it.classroom_id === roomId && overlap(it.start_time, it.end_time, p.start, p.end));
        grid.innerHTML = `
            <table class="w-full text-sm border-collapse" style="min-width:640px;">
                <thead><tr>
                    <th style="width:90px;text-align:left;padding:8px;" class="text-gray-400 text-xs font-medium">节次</th>
                    ${rooms.map(r => `<th style="text-align:left;padding:8px;" class="text-gray-400 text-xs font-medium">${esc(r.name)}</th>`).join('')}
                </tr></thead>
                <tbody>
                ${periodList.map(p => {
                    return `<tr>
                        <td style="padding:6px 8px;" class="text-xs text-gray-600 whitespace-nowrap">${esc(p.label || '')}</td>
                        ${rooms.map(r => {
                            const mine = hits(mineItems, r.id, p);
                            const taken = hits(otherItems, r.id, p);
                            if (mine.length) {
                                return `<td style="padding:6px 8px;"><div class="text-xs text-gray-400 bg-gray-100 rounded px-2 py-1.5 text-center">本班已有课</div></td>`;
                            }
                            if (taken.length) {
                                const names = [...new Set(taken.map(t => t.class_name).filter(Boolean))];
                                return `<td style="padding:6px 8px;"><div class="text-xs text-gray-400 bg-gray-100 rounded px-2 py-1.5 text-center truncate" title="${esc(names.join('、'))}">${esc(names[0] || '已占用')}</div></td>`;
                            }
                            return `<td style="padding:6px 8px;"><button onclick="confirmAddSlot(${wd},'${p.start}','${p.end}','${p.label || ''}',${r.id})" class="w-full text-xs text-green-700 bg-green-50 hover:bg-green-100 rounded px-2 py-1.5 text-center transition">空闲</button></td>`;
                        }).join('')}
                    </tr>`;
                }).join('')}
                </tbody>
            </table>`;
    } catch (e) {
        grid.innerHTML = `<div class="text-red-400 text-sm py-2">加载失败：${esc(e.message)}</div>`;
    }
}

// 点击空闲格 → 弹窗确认（可微调具体时间，如上午二改成 10:30-12:00）→ 落课/更新班期
function confirmAddSlot(wd, start, end, periodLabel, roomId) {
    const room = classroomList.find(c => c.id === roomId);
    Utils.showModal({
        title: currentClass.term_type === 'summer_winter' ? '确定寒暑假班上课安排' : '确定每周固定上课',
        subtitle: `每周${WEEK_NAMES[wd]} · ${periodLabel || ''} · ${room ? room.name : '未设教室'}（具体时间可调整）`,
        width: 420,
        fields: [
            { key: 'start_time', label: '开始时间', type: 'time', default: start, required: true },
            { key: 'end_time', label: '结束时间', type: 'time', default: end, required: true },
        ],
        values: { start_time: start, end_time: end },
        onSubmit: async (data) => {
            if (toMin(data.end_time) <= toMin(data.start_time)) { showToast('结束时间需晚于开始时间', 'error'); return; }
            if (currentClass.term_type === 'summer_winter') {
                // 寒暑假：更新每天固定时段+教室 → 班期（周一~周六、周日休息）自动确定
                try {
                    const r = await API.classes.update(currentClass.id, {
                        daily_start: data.start_time, daily_end: data.end_time, classroom_id: roomId,
                    });
                    if (r.success) {
                        showToast('寒暑假班上课安排已更新，班期自动确定', 'success');
                        currentClass = r.data;
                        loadClassDetail();
                    } else showToast('保存失败：' + (r.error || ''), 'error');
                } catch (e) {
                    const d = e.detail || null;
                    if (d && d.conflicts && d.conflicts.length) {
                        showConflictModal((d.conflicts || []).map(c => ({ type: c.type, time: c.date || '', message: c.message })), '班期冲突');
                    } else showToast('保存失败：' + (d && d.message ? d.message : e.message), 'error');
                }
            } else {
                // 学期：每周该天该时段重复（自动绑定后续周次）
                try {
                    const r = await API.schedules.add({
                        class_id: currentClass.id,
                        weekday: wd, start_time: data.start_time, end_time: data.end_time,
                        classroom_id: roomId,
                        teacher_id: currentClass.teacher_id || null,
                    });
                    if (r.success && r.data.created) {
                        showToast(`已添加：每周${WEEK_NAMES[wd]} ${data.start_time}-${data.end_time} 上课`, 'success');
                        await loadScheduleList();
                        selectSlotWeekday(wd);
                    } else {
                        const c = (r.data && r.data.conflicts) || [];
                        if (c.length) showConflictModal(c);
                        else showToast('添加失败：' + ((r.data && r.data.message) || ''), 'error');
                    }
                } catch (e) { showToast('添加失败：' + e.message, 'error'); }
            }
        },
    });
}

}

/* ---------- 初始化 ---------- */
window.currentClassId = classId;  // 供内联 onclick 使用（编辑/停用/删除）
loadBaseData();
if (classId) { loadClassDetail(); } else { loadClasses(); }
window.currentPageRefresh = classId ? loadClassDetail : loadClasses;

// 修 bug：/classes/4 → /classes/5 是同一路由记录，组件不重挂载，脚本不会重跑。
// 监听 hashchange，classId 变化时整页重载以加载新班级。
function onClassHashChange() {
    const parts = location.hash.split('/');
    const newId = parts[2] ? parseInt(parts[2]) : null;
    if (newId !== classId) location.reload();
}
window.addEventListener('hashchange', onClassHashChange);
window.__pageUnmounted = function () {
    window.removeEventListener('hashchange', onClassHashChange);
    window.__pageUnmounted = null;
};

Object.assign(window, {
    loadClasses, setTermFilter, openClassDetail, showClassModal, showAddStudentModal,
    removeStudent, toggleClassStatus, deleteClass,
    loadScheduleList, openSlotPicker, selectSlotWeekday, confirmAddSlot,
    showManualScheduleModal, deleteSchedule, showExtendModal, showConflictModal, showClassErrorModal,
});
})();
</script>
