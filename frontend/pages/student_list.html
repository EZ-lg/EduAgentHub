<!-- 学生列表页 — 白色简洁风 -->
<div class="fade-in">
    <div class="flex items-center justify-between mb-4">
        <div class="flex gap-2">
            <input type="text" id="student-search" placeholder="搜索姓名/电话..." class="w-56 text-sm" oninput="filterStudents()">
            <select id="student-grade-filter" class="text-sm" onchange="filterStudents()"></select>
            <select id="student-status-filter" class="text-sm" onchange="filterStudents()">
                <option value="">全部状态</option>
                <option value="active">在读</option>
                <option value="completed">已结课</option>
                <option value="abandoned">已放弃</option>
            </select>
        </div>
        <div class="flex gap-2">
            <button onclick="loadStudents()" class="btn-outline" title="刷新列表">↻ 刷新</button>
            <button onclick="showCreateStudentModal()" class="btn-primary">➕ 新建学生</button>
        </div>
    </div>

    <div class="panel overflow-hidden" style="padding:0;">
        <table class="w-full text-sm">
            <thead>
                <tr>
                    <th class="text-left px-4 py-3">姓名</th>
                    <th class="text-left px-4 py-3">年级</th>
                    <th class="text-left px-4 py-3">学校</th>
                    <th class="text-left px-4 py-3">电话</th>
                    <th class="text-left px-4 py-3">活跃学科</th>
                    <th class="text-left px-4 py-3">状态</th>
                    <th class="text-left px-4 py-3">更新时间</th>
                    <th class="text-right px-4 py-3">操作</th>
                </tr>
            </thead>
            <tbody id="student-table-body">
                <tr><td colspan="8" class="text-center py-10 text-gray-300">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="flex items-center justify-between mt-3 text-sm text-gray-400" id="student-pagination"></div>
</div>

<script>
(function () {
let studentPage = 1, studentTotal = 0;

/* ---------- 学生表单字段（新建/编辑共用，两列填表式） ---------- */
function studentFields() {
    return [
        { key: 'name', label: '姓名', required: true, placeholder: '学生姓名', section: '基本信息' },
        { key: 'gender', label: '性别', type: 'select', options: [{ v: '', label: '请选择' }, { v: '男', label: '男' }, { v: '女', label: '女' }], section: '基本信息' },
        { key: 'grade', label: '年级', type: 'select', options: [{ v: '', label: '请选择' }].concat(Utils.grades.map(g => ({ v: g, label: g }))), section: '基本信息' },
        { key: 'school', label: '学校', placeholder: '就读学校', section: '基本信息' },
        { key: 'phone', label: '学生电话', placeholder: '联系电话', section: '联系方式' },
        { key: 'parent_name', label: '家长姓名', section: '联系方式' },
        { key: 'parent_phone', label: '家长电话', section: '联系方式' },
        { key: 'address', label: '家庭地址', placeholder: '家庭住址', section: '其他信息', full: true },
        { key: 'source', label: '来源渠道', placeholder: '转介绍 / 地推 / 线上', section: '其他信息' },
        { key: 'status', label: '状态', type: 'select', options: [{ v: 'active', label: '在读' }, { v: 'completed', label: '已结课' }, { v: 'abandoned', label: '已放弃' }], section: '其他信息' },
    ];
}

/* ---------- 列表加载 ---------- */
async function loadStudents() {
    const search = document.getElementById('student-search')?.value || '';
    const grade = document.getElementById('student-grade-filter')?.value || '';
    const status = document.getElementById('student-status-filter')?.value || '';
    try {
        const resp = await API.students.list({ search, grade, status, page: studentPage, page_size: 15 });
        if (resp.success) { studentTotal = resp.data.total; renderTable(resp.data.items); renderPagination(); }
    } catch(e) {
        document.getElementById('student-table-body').innerHTML = `<tr><td colspan="8" class="text-center py-10 text-red-400">加载失败: ${Utils.escapeHtml(e.message)}</td></tr>`;
    }
}

function renderTable(items) {
    const tbody = document.getElementById('student-table-body');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10 text-gray-300">暂无学生，点击右上角新建</td></tr>';
        return;
    }
    tbody.innerHTML = items.map(s => {
        const st = Utils.statusLabel(s.status);
        const sc = s.active_subjects || 0;
        const subjectBadge = sc > 0
            ? `<span class="px-2 py-0.5 rounded-full text-xs bg-blue-50 text-blue-600">${sc} 科</span>`
            : '<span class="text-gray-300">0</span>';
        return `<tr class="cursor-pointer" onclick="location.hash='#/student/${s.id}'">
            <td class="px-4 py-3 font-medium text-gray-800">${Utils.escapeHtml(s.name)}</td>
            <td class="px-4 py-3 text-gray-600">${Utils.escapeHtml(s.grade)}</td>
            <td class="px-4 py-3 text-gray-500">${Utils.escapeHtml(s.school)}</td>
            <td class="px-4 py-3 text-gray-500">${Utils.escapeHtml(s.phone)}</td>
            <td class="px-4 py-3">${subjectBadge}</td>
            <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs ${st.cls}">${st.text}</span></td>
            <td class="px-4 py-3 text-gray-300 text-xs">${Utils.formatDate(s.updated_at)}</td>
            <td class="px-4 py-3 text-right">
                <button onclick="event.stopPropagation();editStudent(${s.id})" class="text-blue-500 hover:text-blue-700 mr-2" title="编辑">✏️</button>
                <button onclick="event.stopPropagation();deleteStudentConfirm(${s.id})" class="text-gray-300 hover:text-red-500" title="删除">🗑️</button>
            </td>
        </tr>`;
    }).join('');
}

function renderPagination() {
    const totalPages = Math.ceil(studentTotal / 15);
    document.getElementById('student-pagination').innerHTML = totalPages > 1
        ? `<span>共 ${studentTotal} 条 · ${studentPage}/${totalPages}</span>
           <div class="flex gap-1">
               <button onclick="changePage(-1)" class="px-2 py-1 border rounded text-xs hover:border-gray-400" ${studentPage<=1?'disabled':''}>‹ 上一页</button>
               <button onclick="changePage(1)" class="px-2 py-1 border rounded text-xs hover:border-gray-400" ${studentPage>=totalPages?'disabled':''}>下一页 ›</button>
           </div>`
        : `<span>共 ${studentTotal} 条</span>`;
}

function filterStudents() { studentPage = 1; loadStudents(); }

// 分页（供内联 onclick 调用；IIFE 内 studentPage 作用域隔离，不能直接内联读写）
function changePage(delta) {
    const totalPages = Math.max(1, Math.ceil(studentTotal / 15));
    studentPage = Math.min(totalPages, Math.max(1, studentPage + delta));
    loadStudents();
}

/* ---------- 新建/编辑/删除 ---------- */
function showCreateStudentModal() {
    Utils.showModal({
        title: '新建学生',
        subtitle: '一次填完基本信息，方便后续跟进',
        fields: studentFields(),
        columns: 2,
        width: 640,
        onSubmit: async (data) => {
            try {
                const r = await API.students.create(data);
                if (r.success) { showToast('学生创建成功', 'success'); loadStudents(); }
                else showToast('创建失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('创建失败：' + e.message, 'error'); }
        },
    });
}

function editStudent(id) {
    API.students.get(id).then(r => {
        if (!r.success) { showToast('加载学生失败：' + (r.error || '未知错误'), 'error'); return; }
        Utils.showModal({
            title: '编辑学生',
            subtitle: '修改学生信息',
            fields: studentFields(),
            columns: 2,
            width: 640,
            values: r.data,
            onSubmit: async (data) => {
                try {
                    const resp = await API.students.update(id, data);
                    if (resp.success) { showToast('已保存', 'success'); loadStudents(); }
                    else showToast('保存失败：' + (resp.error || '未知错误'), 'error');
                } catch (e) { showToast('保存失败：' + e.message, 'error'); }
            },
        });
    });
}

function deleteStudentConfirm(id) {
    Utils.confirmDialog({
        title: '删除学生',
        message: '确定删除该学生？<br>该生的所有学科、报告、成绩、规划等数据将被<b>永久删除</b>，且不可恢复！',
        danger: true,
        onOk: async () => {
            try {
                const r = await API.students.delete(id);
                if (r.success) { showToast('已删除', 'success'); loadStudents(); }
                else showToast('删除失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('删除失败：' + e.message, 'error'); }
        },
    });
}

/* ---------- 初始化：年级筛选下拉 ---------- */
document.getElementById('student-grade-filter').innerHTML =
    '<option value="">全部年级</option>' +
    Utils.grades.map(g => `<option>${g}</option>`).join('');

// 注册全局刷新（顶部「↻ 刷新」按钮 / 切回标签页自动调用）
window.currentPageRefresh = loadStudents;

loadStudents();

/* ---------- IIFE 作用域导出：供内联 onclick 调用 ---------- */
Object.assign(window, {
    loadStudents, showCreateStudentModal, editStudent, deleteStudentConfirm,
    filterStudents, changePage,
});
})();
</script>
