<!-- 学生总览页 — 2.0 P5 G5：顶部总览 + 学科卡片区 + 班级区 + 学科功能 Tab -->
<div class="fade-in">
    <div class="flex items-center gap-3 mb-4">
        <a href="#/students" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-indigo-500 transition"><svg class="icon icon--sm"><use href="#icon-arrow-left"/></svg> 返回列表</a>
    </div>

    <div class="panel mb-4" id="student-info-card">
        <div class="text-center py-10 text-gray-300">加载中...</div>
    </div>

    <div class="mb-4">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5"><svg class="icon icon--md text-indigo-500"><use href="#icon-book-open"/></svg> 学科管理</h2>
            <div class="flex gap-2">
                <button onclick="refreshStudentDetail()" class="btn-outline" style="padding:6px 16px;font-size:13px;" title="刷新当前页数据"><svg class="icon icon--md"><use href="#icon-refresh-cw"/></svg> 刷新</button>
                <button onclick="showAddSubjectModal()" class="btn-primary" style="padding:6px 16px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-plus"/></svg> 新增学科</button>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3" id="subject-cards">
            <div class="col-span-full text-gray-300 text-sm py-4">加载中...</div>
        </div>
    </div>

    <!-- 班级区（2.0 P5 G5.1/G2.7：学生报班关系 + 课次） -->
    <div class="panel mb-4">
        <div class="panel-title mb-2"><svg class="icon icon--md text-indigo-500"><use href="#icon-clipboard-list"/></svg> 班级</div>
        <div id="student-classes"><div class="text-gray-300 text-sm py-3">加载中...</div></div>
    </div>

    <div id="subject-detail-area" class="hidden">
        <a href="#" onclick="backToOverview()" id="back-to-overview" class="hidden inline-flex items-center gap-1 text-sm text-gray-400 hover:text-indigo-500 mb-3 transition"><svg class="icon icon--sm"><use href="#icon-arrow-left"/></svg> 返回学科总览</a>
        <div class="flex gap-0 border-b" style="border-color:var(--border);" id="subject-tabs">
            <button class="px-4 py-2.5 text-sm font-medium text-indigo-600 bg-white border border-b-0 rounded-t-lg inline-flex items-center gap-1.5" style="border-color:var(--border); margin-bottom:-1px;" data-tab="report" onclick="switchSubjectTab('report')"><svg class="icon icon--md"><use href="#icon-file-text"/></svg> 报告</button>
            <button class="px-4 py-2.5 text-sm text-gray-400 hover:text-gray-600 inline-flex items-center gap-1.5" data-tab="plan" onclick="switchSubjectTab('plan')"><svg class="icon icon--md"><use href="#icon-calendar"/></svg> 课程规划</button>
            <button class="px-4 py-2.5 text-sm text-gray-400 hover:text-gray-600 inline-flex items-center gap-1.5" data-tab="scores" onclick="switchSubjectTab('scores')"><svg class="icon icon--md"><use href="#icon-bar-chart-3"/></svg> 成绩</button>
            <button class="px-4 py-2.5 text-sm text-gray-400 hover:text-gray-600 inline-flex items-center gap-1.5" data-tab="logs" onclick="switchSubjectTab('logs')"><svg class="icon icon--md"><use href="#icon-notebook-pen"/></svg> 沟通日志</button>
        </div>
        <div class="panel min-h-[200px]" style="border-radius:0 0 12px 12px; border-top:none;" id="subject-tab-content">
            <p class="text-gray-300 text-center py-10">加载中...</p>
        </div>
    </div>
</div>

<script>
(function () {
const hashParts = location.hash.split('/');
const studentId = parseInt(hashParts[2]);
const routeSubjectId = hashParts[4] ? parseInt(hashParts[4]) : null;
let currentSubjectId = routeSubjectId;

/* ---------- 学生表单字段（编辑用，两列填表式） ---------- */
function studentFields() {
    return [
        { key: 'name', label: '姓名', required: true, placeholder: '学生姓名', section: '基本信息' },
        { key: 'gender', label: '性别', type: 'select', options: [{ v: '', label: '请选择' }, { v: '男', label: '男' }, { v: '女', label: '女' }], section: '基本信息' },
        { key: 'grade', label: '年级', type: 'select', options: [{ v: '', label: '请选择' }].concat(Utils.grades.map(g => ({ v: g, label: g }))), section: '基本信息' },
        { key: 'school', label: '学校', placeholder: '就读学校', section: '基本信息' },
        { key: 'phone', label: '学生电话', placeholder: '联系电话', section: '联系方式' },
        { key: 'parent_name', label: '家长姓名', section: '联系方式' },
        { key: 'parent_phone', label: '家长电话', section: '联系方式' },
        { key: 'address', label: '家庭地址', placeholder: '家庭住址', section: '其他信息', full: true },
        { key: 'source', label: '来源渠道', placeholder: '转介绍 / 地推 / 线上', section: '其他信息' },
        { key: 'status', label: '状态', type: 'select', options: [{ v: 'active', label: '在读' }, { v: 'completed', label: '已结课' }, { v: 'abandoned', label: '已放弃' }], section: '其他信息' },
    ];
}

/* ---------- 学生总览（2.0 P5 G5：顶部信息 + 统计 + 学科卡片 + 班级区） ---------- */
let overviewData = null;   // /api/students/{id}/overview 聚合缓存

const AVATAR_COLORS = ['#6C5CE7', '#8B5CF6', '#EC6BAF', '#FF9F45', '#34C48B', '#5B8DEF', '#14B8A6', '#F97316'];
function avatarColor(name) {
    let sum = 0;
    for (const ch of String(name || '')) sum += ch.charCodeAt(0);
    return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}

async function loadStudentOverview() {
    let ov = null;
    try {
        const r = await API.overview.student(studentId);
        if (r.success) ov = r.data;
    } catch (e) { console.error('学生总览加载失败:', e); }
    if (!ov) {
        document.getElementById('student-info-card').innerHTML =
            `<div class="text-center py-10 text-red-400">总览加载失败，请刷新重试</div>`;
        return;
    }
    overviewData = ov;
    subjectList = ov.subjects || [];   // 供新增学科查重
    renderStudentInfoCard(ov);
    renderSubjectCards(ov);
    renderClassSection(ov);
}

// 学生信息卡（含头像缩写 + 统计条），供状态切换/编辑后局部刷新复用
function renderStudentInfoCard(ov) {
    const s = ov.student;
    const st = Utils.statusLabel(s.status);
    const stats = ov.stats || {};
    const box = document.getElementById('student-info-card');
    box.innerHTML = `
        <div class="flex items-start gap-4 flex-wrap">
            <div class="student-avatar-lg" style="background:${avatarColor(s.name)};">${esc((s.name || '?').charAt(0))}</div>
            <div class="flex-1" style="min-width:240px;">
                <div class="flex items-center gap-3 mb-3 flex-wrap">
                    <h1 class="text-xl font-bold text-gray-800">${esc(s.name)}</h1>
                    <span class="${st.cls}">${st.text}</span>
                    ${s.grade ? `<span class="text-sm text-gray-400">${esc(s.grade)}</span>` : ''}
                </div>
                <div class="grid grid-cols-2 gap-x-8 gap-y-1 text-sm text-gray-500">
                    <div>性别：${esc(s.gender) || '-'}</div>
                    <div>学校：${esc(s.school) || '-'}</div>
                    <div>电话：${esc(s.phone) || '-'}</div>
                    <div>家长：${esc(s.parent_name) || '-'} ${esc(s.parent_phone) || ''}</div>
                    <div>地址：${esc(s.address) || '-'}</div>
                    <div>来源：${esc(s.source) || '-'}</div>
                    <div>建档：${Utils.formatDate(s.created_at)}</div>
                </div>
                ${s.notes ? `<div class="mt-3 pt-3 border-t border-gray-100 text-sm text-gray-400">备注：${esc(s.notes)}</div>` : ''}
            </div>
            <div class="flex flex-col items-end gap-2">
                <button onclick="openStudentChat()" class="btn-primary" style="padding:6px 16px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-bot"/></svg> AI 助手</button>
                <select onchange="changeStudentStatus(this.value)" class="text-xs py-1 px-2 rounded-lg border">
                    <option value="active" ${s.status==='active'?'selected':''}>在读</option>
                    <option value="completed" ${s.status==='completed'?'selected':''}>已结课</option>
                    <option value="abandoned" ${s.status==='abandoned'?'selected':''}>已放弃</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="editStudentInfo()" class="text-xs text-gray-400 hover:text-indigo-500 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-pencil"/></svg> 编辑</button>
                    <button onclick="deleteStudent()" class="text-xs text-gray-300 hover:text-red-500 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-trash-2"/></svg> 删除</button>
                </div>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 mt-4 pt-4 border-t" style="border-color:var(--border-soft);">
            <div class="stat-chip"><b class="num">${stats.subject_count || 0}</b><span>学科</span></div>
            <div class="stat-chip"><b class="num">${stats.active_subject_count || 0}</b><span>活跃学科</span></div>
            <div class="stat-chip"><b class="num">${stats.class_count || 0}</b><span>报班</span></div>
            <div class="stat-chip"><b class="num">${stats.weekly_sessions || 0}</b><span>本周课次</span></div>
        </div>
    `;
}

/* ---------- 班级区（该生所有班级 + 排课摘要） ---------- */
function renderClassSection(ov) {
    const classes = ov.classes || [];
    const box = document.getElementById('student-classes');
    if (!box) return;
    if (!classes.length) {
        box.innerHTML = '<div class="text-gray-300 text-sm py-3">该生暂未报班。可在学科卡片点「一对一」快速建班，或到「班级管理」添加。</div>';
        return;
    }
    box.innerHTML = classes.map(c => {
        const typeBadge = c.term_type === 'summer_winter'
            ? '<span class="badge badge--warning">寒暑假班</span>'
            : '<span class="badge badge--info">学期跟班</span>';
        const stBadge = c.status === 'active'
            ? '<span class="badge badge--success">在读</span>'
            : '<span class="badge badge--neutral">已停用</span>';
        const schedHtml = c.term_type === 'summer_winter'
            ? `<div class="text-xs text-gray-400 mt-1">每天 ${esc(c.daily_start)}-${esc(c.daily_end)} · 共 ${c.total_lessons} 天 · ${esc(c.start_date || '?')}~${esc(c.end_date || '?')}</div>`
            : (c.schedules && c.schedules.length
                ? `<div class="flex flex-wrap gap-1 mt-1.5">${c.schedules.map(s => `<span class="badge badge--info">${esc(s.weekday_label)} ${esc(s.start_time)}-${esc(s.end_time)}</span>`).join('')}</div>`
                : '<div class="text-xs text-gray-400 mt-1">尚未排课 · <a class="text-indigo-500" href="#/classes/' + c.id + '" onclick="event.stopPropagation()">去排课</a></div>');
        return `<div class="flex items-center justify-between gap-3 py-2.5 border-b cursor-pointer hover:bg-gray-50 rounded px-1.5 -mx-1.5 transition" style="border-color:var(--border-soft);" onclick="location.hash='#/classes/${c.id}'">
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-medium text-gray-800">${esc(c.name)}</span>
                    ${typeBadge}${stBadge}
                </div>
                <div class="text-xs text-gray-400 mt-0.5">${esc(c.subject_name || '未设学科')} · ${esc(c.teacher_name || '未指派教师')} · ${esc(c.classroom_name || '未设教室')} · ${c.student_count} 人</div>
                ${schedHtml}
            </div>
            <span class="text-gray-300 shrink-0"><svg class="icon"><use href="#icon-chevron-right"/></svg></span>
        </div>`;
    }).join('');
}

function backToOverview() {
    location.hash = '#/student/' + studentId;
}

function changeStudentStatus(status) {
    API.students.updateStatus(studentId, status).then(r => {
        if (r.success) { showToast('状态已更新', 'success'); loadStudentOverview(); }
        else showToast('更新失败：' + (r.error || '未知错误'), 'error');
    }).catch(e => showToast('更新失败：' + e.message, 'error'));
}

function editStudentInfo() {
    API.students.get(studentId).then(r => {
        if (!r.success) { showToast('加载失败', 'error'); return; }
        Utils.showModal({
            title: '编辑学生',
            subtitle: '修改学生信息',
            fields: studentFields(),
            columns: 2,
            width: 640,
            values: r.data,
            onSubmit: async (data) => {
                try {
                    const resp = await API.students.update(studentId, data);
                    if (resp.success) { showToast('已保存', 'success'); loadStudentOverview(); }
                    else showToast('保存失败：' + (resp.error || '未知错误'), 'error');
                } catch (e) { showToast('保存失败：' + e.message, 'error'); }
            },
        });
    }).catch(e => showToast('加载学生信息失败：' + e.message, 'error'));
}

function deleteStudent() {
    Utils.confirmDialog({
        title: '删除学生',
        messageHtml: '确定删除该学生？<br>该生的所有学科、报告、成绩、规划等数据将被<b>永久删除</b>，且不可恢复！',
        danger: true,
        onOk: async () => {
            try {
                const r = await API.students.delete(studentId);
                if (r.success) { showToast('已删除', 'success'); setTimeout(() => location.hash = '#/students', 600); }
                else showToast('删除失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('删除失败：' + e.message, 'error'); }
        },
    });
}

/* ---------- 学科卡片（升级版：成绩迷你线 + 报告状态 + 规划进度 + 班型教师） ---------- */
let subjectList = [];   // 缓存当前学科列表，用于新增时查重

// 内联 SVG 火花线：scores=[[date, percent]...] 升序，≥2 点才画
function sparkline(scores, width = 110, height = 30) {
    if (!scores || scores.length < 2) return '';
    const pts = scores.map(s => s[1]);
    const min = Math.min(...pts), max = Math.max(...pts);
    const range = (max - min) || 1;
    const x = i => (i * (width - 4)) / (pts.length - 1) + 2;
    const y = v => height - 4 - ((v - min) / range) * (height - 10);
    const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `${line} L${x(pts.length - 1).toFixed(1)},${height - 2} L${x(0).toFixed(1)},${height - 2} Z`;
    const up = pts[pts.length - 1] >= pts[0];
    const color = up ? '#10b981' : '#ef4444';
    return `<svg width="${width}" height="${height}" class="sparkline" style="display:block;">
        <path d="${area}" fill="${color}" opacity="0.12"/>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

async function loadSubjects() {
    await loadStudentOverview();
}

function renderSubjectCards(ov) {
    const subs = ov.subjects || [];
    const container = document.getElementById('subject-cards');
    if (!container) return;
    if (!subs.length) {
        container.innerHTML = '<div class="col-span-full text-gray-300 text-sm py-4">暂无学科，点击右上角新增</div>';
        return;
    }
    container.innerHTML = subs.map(sub => {
        const isActive = sub.status === 'active';
        const icon = Utils.subjectIcon(sub.name);
        const active = currentSubjectId === sub.id ? 'active-subject' : '';
        const repBadge = sub.report
            ? (sub.report.status === 'published'
                ? '<span class="badge badge--success">已出报告</span>'
                : '<span class="badge badge--neutral">报告草稿</span>')
            : '<span class="badge badge--neutral" style="opacity:.55;">无报告</span>';
        const planText = sub.plan
            ? `<span class="text-[11px] text-gray-400">v${sub.plan.version} · ${sub.plan.lesson_count}课${sub.plan.total_hours ? ' · ' + sub.plan.total_hours + 'h' : ''}</span>`
            : '';
        const classText = sub.class_name
            ? `<span class="inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#${pairNumOf(sub.class_type) === 1 ? 'icon-user' : 'icon-users'}"/></svg> ${classTypeLabel(sub.class_type)}${sub.teacher_name ? ' · ' + esc(sub.teacher_name) : ''}</span>`
            : '<span class="text-gray-300">未报班</span>';
        const spark = sparkline(sub.scores);
        return `<div class="subject-card ${active}" onclick="selectSubject(${sub.id})">
            <div class="flex items-center gap-2 mb-1">
                <span class="subject-icon"><svg class="icon"><use href="#${icon}"/></svg></span>
                <span class="font-medium text-gray-700 truncate">${esc(sub.name)}</span>
            </div>
            <div class="text-[11px] text-gray-400">${classText}</div>
            <div class="flex items-center justify-between mt-1.5 gap-1 flex-wrap">
                ${repBadge}${planText}
            </div>
            ${spark ? `<div class="mt-1.5">${spark}</div>` : ''}
            <div class="flex items-center justify-between text-xs mt-2 pt-2 border-t" style="border-color:var(--border-soft);">
                <span class="${isActive ? 'text-green-600' : 'text-gray-400'} inline-flex items-center gap-1"><span class="status-dot ${isActive ? 'status-dot--on' : 'status-dot--off'}"></span>${isActive ? '活跃' : '已停用'}</span>
                <div class="flex items-center gap-2">
                    <button onclick="event.stopPropagation();location.hash='#/conversation/${sub.id}'" class="text-gray-300 hover:text-indigo-500 text-xs inline-flex items-center gap-0.5" title="进入 AI 对话采集"><svg class="icon icon--sm"><use href="#icon-message-square"/></svg> 对话</button>
                    ${isActive ? `<button onclick="event.stopPropagation();createClassFromSubject(${sub.id})" class="text-gray-300 hover:text-green-600 text-xs inline-flex items-center gap-0.5" title="转为一对一上课班级"><svg class="icon icon--sm"><use href="#icon-user-plus"/></svg> 一对一</button>` : ''}
                    <button onclick="event.stopPropagation();toggleSubject(${sub.id},'${sub.status}')" class="text-gray-300 hover:text-gray-500 text-xs">${isActive ? '停用' : '启用'}</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function selectSubject(id) {
    // 通过路由切换，页面自动重挂载并按 routeSubjectId 选中
    location.hash = `#/student/${studentId}/subject/${id}`;
}

/* 转为一对一上课班级（2.0 班级管理快捷入口） */
async function createClassFromSubject(subjectId) {
    let teacherOpts = [], roomOpts = [];
    try {
        const [t, c] = await Promise.all([API.teachers.list(), API.classrooms.list()]);
        teacherOpts = ((t.success && t.data) || []).map(x => ({ v: x.id, label: x.name }));
        roomOpts = ((c.success && c.data) || []).filter(x => x.status === 'active')
            .map(x => ({ v: x.id, label: x.name + (x.location ? '（' + x.location + '）' : '') }));
    } catch (e) { /* 下拉数据失败不阻塞 */ }
    Utils.showModal({
        title: '转为一对一班',
        subtitle: '将当前学科升级为 1v1 上课班级（绑定教师/教室后即可在班级管理里排课）',
        width: 520,
        columns: 2,
        fields: [
            { key: 'teacher_id', label: '教师', type: 'select', options: teacherOpts.length ? teacherOpts : [{ v: '', label: '（暂无教师，可后补）' }], section: '排课信息' },
            { key: 'classroom_id', label: '教室', type: 'select', options: roomOpts.length ? roomOpts : [{ v: '', label: '（暂无教室，可后补）' }], section: '排课信息' },
            { key: 'weekly_frequency', label: '每周课次', type: 'number', min: 1, default: 2, section: '排课信息' },
            { key: 'duration_minutes', label: '每次时长(分)', type: 'number', min: 30, default: 120, section: '排课信息' },
        ],
        onSubmit: async (data) => {
            data.teacher_id = data.teacher_id ? Number(data.teacher_id) : null;
            data.classroom_id = data.classroom_id ? Number(data.classroom_id) : null;
            try {
                const r = await API.classes.createFromSubject(subjectId, data);
                if (r.success) { showToast('已创建一对一班级', 'success'); location.hash = '#/classes/' + r.data.id; }
                else showToast('创建失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('创建失败：' + e.message, 'error'); }
        },
    });
}

function toggleSubject(id, cur) {
    const ns = cur === 'active' ? 'paused' : 'active';
    Utils.confirmDialog({
        title: ns === 'paused' ? '停用学科' : '启用学科',
        message: ns === 'paused'
            ? `确定停用该学科？停用后保留所有历史数据，不再参与活跃管理。`
            : `确定重新启用该学科？`,
        onOk: async () => {
            try {
                const r = await API.subjects.updateStatus(id, ns);
                if (r.success) { showToast(ns === 'paused' ? '已停用' : '已启用', 'success'); loadSubjects(); }
                else showToast('操作失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('操作失败：' + e.message, 'error'); }
        },
    });
}

function showAddSubjectModal() {
    Utils.showModal({
        title: '新增学科',
        subtitle: '选择要补课的学科',
        fields: [
            { key: 'name', label: '学科', type: 'select', options: Utils.subjectPresets.map(s => ({ v: s, label: s })), required: true },
        ],
        onSubmit: (data) => {
            // 查重：已存在同名字科则二次确认，避免误加重复学科
            const dup = subjectList.find(s => s.name === data.name);
            if (dup) {
                Utils.confirmDialog({
                    title: '学科已存在',

function studentChatHtml(messages) {

            ${bubbles || '<div class="text-gray-400 text-sm text-center py-10">问 AI 关于这个孩子的情况，例如「这孩子最近学得怎么样？」</div>'}

}

function openStudentChat() {
    Utils.showModal({
        title: 'AI 助手 · 了解孩子情况',
        subtitle: '基于学生档案与各学科学情作答',
        width: 560,
        hideOk: true,
        bodyHtml: studentChatHtml(studentChatHistory),
    });
    // showModal 渲染后绑定事件
    setTimeout(() => {
        const input = document.getElementById('student-chat-input');
        const sendBtn = document.getElementById('student-chat-send');
        const doSend = () => sendStudentChat(input);
        if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });
        if (sendBtn) sendBtn.addEventListener('click', doSend);
        if (input) input.focus();
    }, 50);
}

async function sendStudentChat(input) {
    if (studentChatBusy) return;   // 请求未返回时忽略再次发送
    const text = (input && input.value.trim()) || '';
    if (!text) return;
    studentChatBusy = true;
    const sendBtn = document.getElementById('student-chat-send');
    if (sendBtn) sendBtn.disabled = true;
    input.value = '';
    // 乐观追加用户消息
    studentChatHistory = studentChatHistory.concat([{ role: 'user', content: text }]);
    renderStudentChat();
    // 追加"思考中"占位
    studentChatHistory = studentChatHistory.concat([{ role: 'ai', content: '（思考中…）' }]);
    renderStudentChat();
    try {
        const r = await API.students.chat(studentId, studentChatHistory.filter(m => m.content !== '（思考中…）'));
        if (!r.success) throw new Error(r.error);
        studentChatHistory = studentChatHistory.slice(0, -1).concat([{ role: 'ai', content: r.data.reply }]);
        renderStudentChat();
    } catch (e) {
        studentChatHistory = studentChatHistory.slice(0, -1);
        renderStudentChat();
        showToast('AI 回复失败：' + e.message, 'error');
    } finally {
        studentChatBusy = false;
        const btn = document.getElementById('student-chat-send');
        if (btn) btn.disabled = false;
    }
}

function renderStudentChat() {
    const box = document.getElementById('student-chat-box');
    const holder = document.getElementById('student-chat-box');
    if (!box) return;
    box.innerHTML = studentChatHistory.map(m => {
        const isAi = m.role === 'ai';
        const align = isAi ? 'items-start' : 'items-end justify-end';
        const bubbleCls = isAi ? 'bg-indigo-50 text-gray-800' : 'bg-indigo-600 text-white';
        return `<div class="flex ${align} mb-2">
            <div class="max-w-[80%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${bubbleCls}">${Utils.escapeHtml(m.content)}</div>
        </div>`;
    }).join('');
    if (holder) holder.scrollTop = holder.scrollHeight;
}

/* ---------- P6 通用辅助 ---------- */
function esc(s) { return Utils.escapeHtml(String(s ?? '')); }
// 班型「一对几」：1v1→一对1、1v3→一对3、旧 1vN→一对多（小班）
function pairNumOf(ct) { const m = /^1v(\d+)$/i.exec(String(ct || '')); return m ? parseInt(m[1]) : 0; }
function classTypeLabel(ct) { const n = pairNumOf(ct); return n ? `一对${n}` : '一对多（小班）'; }

function safeParse(str, fallback) {
    try { return JSON.parse(str || 'null') || fallback; } catch (e) { return fallback; }
}

function fmtNum(n) {
    const v = Number(n);
    if (isNaN(v)) return '-';
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function pctText(score, total) {
    if (!total || total <= 0) return '-';
    return (score / total * 100).toFixed(1) + '%';
}

let goalPercent = null;   // AI 分析返回的目标百分比，画参考线用

function parseBatchLines(text) {
    const errors = [];
    const items = [];
    const lines = String(text || '').split(/\r?\n/);
    lines.forEach((raw, idx) => {
        const line = raw.trim();
        if (!line) return;
        const parts = line.split(/[,，]/).map(s => s.trim());
        if (parts.length < 2 || !parts[1]) {
            errors.push(`第${idx + 1}行：缺少分数`);
            return;
        }
        const score = Number(parts[1]);
        if (isNaN(score) || score < 0) {
            errors.push(`第${idx + 1}行：分数「${parts[1]}」无效`);
            return;
        }
        let total = 100;
        if (parts[2]) {
            total = Number(parts[2]);
            if (isNaN(total) || total <= 0) {
                errors.push(`第${idx + 1}行：满分「${parts[2]}」无效`);
                return;
            }
        }
        let date = '';
        if (parts[3]) {
            const m = parts[3].replace(/\//g, '-').match(/^\d{4}-\d{2}-\d{2}/);
            if (m) date = m[0];
        }
        items.push({
            exam_name: parts[0],
            score,
            total_score: total,
            exam_date: date,
            notes: parts[4] || '',
        });
    });
    return { items, errors };
}

/* ---------- ECharts 曲线（生命周期安全） ---------- */
function disposeScoreChart() {
    if (scoreChart) { scoreChart.dispose(); scoreChart = null; }
}
function onScoreChartResize() {
    if (scoreChart && document.getElementById('score-chart')) scoreChart.resize();
}

function initScoreChart(scores) {
    const el = document.getElementById('score-chart');
    if (!el) return;
    disposeScoreChart();
    if (!scores || !scores.length || typeof echarts === 'undefined') return;
    scoreChartData = scores;
    scoreChart = echarts.init(el);
    scoreChart.setOption(buildScoreOption(scores, scoreChartMode));
}

function buildScoreOption(scores, mode) {
    const asc = [...scores].sort((a, b) => new Date(a.exam_date) - new Date(b.exam_date));
    const x = asc.map(s => Utils.formatDate(s.exam_date));
    const y = asc.map(s => mode === 'percent'
        ? (s.total_score > 0 ? +(s.score / s.total_score * 100).toFixed(1) : 0)
        : s.score);
    const markLine = (mode === 'percent' && goalPercent)
        ? {
            silent: true, symbol: 'none',
            label: { formatter: `目标 ${goalPercent}%`, color: '#dc2626', position: 'insideEndTop' },
            lineStyle: { color: '#dc2626', type: 'dashed', width: 1 },
            data: [{ yAxis: goalPercent }],
        }
        : undefined;
    return {
        tooltip: {
            trigger: 'axis',
            formatter: (params) => {
                const s = asc[params[0].dataIndex];
                return `${Utils.formatDate(s.exam_date)}<br/>${esc(s.exam_name || '考试')}<br/><b>${fmtNum(s.score)}/${fmtNum(s.total_score)}</b> 分（${pctText(s.score, s.total_score)}）`;
            },
        },
        grid: { left: 50, right: 24, top: 36, bottom: 30 },
        xAxis: { type: 'category', data: x, boundaryGap: false },
        yAxis: { type: 'value', name: mode === 'percent' ? '百分制' : '原始分', min: mode === 'percent' ? 0 : undefined },
        series: [{
            name: mode === 'percent' ? '百分制' : '原始分',
            type: 'line',
            data: y,
            smooth: true,
            symbolSize: 8,
            lineStyle: { width: 2, color: '#6C5CE7' },
            itemStyle: { color: '#6C5CE7' },
            markLine,
        }],
    };
}

function setScoreChartMode(mode) {
    scoreChartMode = mode;
    const el = document.getElementById('score-chart');
    if (scoreChart && el) scoreChart.setOption(buildScoreOption(scoreChartData, mode), true);
    document.querySelectorAll('[data-chart-mode]').forEach(b => {
        const active = b.dataset.chartMode === mode;
        b.className = active ? 'btn-primary' : 'btn-outline';
        b.style.cssText = 'padding:5px 12px;font-size:12px;';
    });
}

/* ---------- AI 成绩分析 ---------- */
async function runScoreAnalysis() {
    if (!scoresList.length) { showToast('请先录入成绩', 'error'); return; }
    const panel = document.getElementById('score-analysis-panel');
    if (panel) {
        panel.classList.remove('hidden');
        panel.innerHTML = '<p class="text-gray-400 text-center py-6 inline-flex items-center gap-1.5"><svg class="icon icon--md icon-spin"><use href="#icon-loader"/></svg> AI 正在分析成绩趋势，请稍候…</p>';
    }
    try {
        const r = await API.scores.analyze(currentSubjectId);
        if (!r.success) throw new Error(r.error);
        const a = r.data.analysis || {};
        goalPercent = a.goal_percent || null;
        renderScoreAnalysis(panel, a);
        if (scoreChart) scoreChart.setOption(buildScoreOption(scoreChartData, scoreChartMode), true);
        showToast('成绩分析完成', 'success');
    } catch (e) {
        if (panel) { panel.classList.add('hidden'); panel.innerHTML = ''; }
        showToast('分析失败：' + e.message, 'error');
    }
}

function renderScoreAnalysis(panel, a) {
    const trendColor = {
        '上升': 'badge badge--success',
        '平稳': 'badge badge--info',
        '波动': 'badge badge--warning',
        '下降': 'badge badge--danger',
        '上升后回落': 'badge badge--warning',
    };
    const trendCls = trendColor[a.trend] || 'badge badge--neutral';
    const weakHtml = (a.weak_points || []).map(w =>
        `<li class="text-sm text-gray-600">${esc(w.area)}${w.detail ? `<span class="text-gray-400"> — ${esc(w.detail)}</span>` : ''}</li>`).join('')
        || '<li class="text-sm text-gray-400">暂无薄弱点标注</li>';
    const suggHtml = (a.suggestions || []).map(s => `<li class="text-sm text-gray-600">${esc(s)}</li>`).join('')
        || '<li class="text-sm text-gray-400">暂无建议</li>';
    if (!panel) return;
    panel.classList.remove('hidden');
    panel.innerHTML = `
        <div class="rounded-xl border p-4" style="border-color:var(--primary-border);background:var(--primary-soft);">
            <div class="flex items-center gap-3 mb-3 flex-wrap">
                <span class="font-semibold text-gray-700 text-sm inline-flex items-center gap-1.5"><svg class="icon icon--md text-indigo-500"><use href="#icon-bot"/></svg> AI 成绩分析</span>
                <span class="${trendCls}">趋势：${esc(a.trend || '-')}</span>
                ${goalPercent ? `<span class="badge badge--danger">目标参考线 ${goalPercent}%</span>` : ''}
            </div>
            ${a.trend_detail ? `<p class="text-sm text-gray-600 mb-3">${esc(a.trend_detail)}</p>` : ''}
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <div class="text-xs font-semibold text-gray-400 mb-1 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-trending-down"/></svg> 薄弱点</div>
                    <ul class="list-disc pl-4 space-y-1">${weakHtml}</ul>
                </div>
                <div>
                    <div class="text-xs font-semibold text-gray-400 mb-1 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-trending-up"/></svg> 学习建议</div>
                    <ol class="list-decimal pl-4 space-y-1">${suggHtml}</ol>
                </div>
            </div>
            ${a.gap_analysis ? `<div class="mt-3 pt-3 border-t text-sm text-gray-600" style="border-color:var(--border);"><span class="text-xs font-semibold text-gray-400 mr-2 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-target"/></svg> 与目标差距</span>${esc(a.gap_analysis)}</div>` : ''}
        </div>`;
}

let currentSubjectTab = 'report';   // 记住当前 Tab：刷新/切回窗口时保留，不再自动跳回报告

function switchSubjectTab(tab) {
    currentSubjectTab = tab;
    document.querySelectorAll('#subject-tabs [data-tab]').forEach(b => {
        const isActive = b.dataset.tab === tab;
        b.className = isActive
            ? 'px-4 py-2.5 text-sm font-medium text-indigo-600 bg-white border border-b-0 rounded-t-lg inline-flex items-center gap-1.5'
            : 'px-4 py-2.5 text-sm text-gray-400 hover:text-gray-600 inline-flex items-center gap-1.5';
        if (isActive) { b.style.cssText = 'border-color:var(--border); margin-bottom:-1px;'; }
        else b.style.cssText = '';
    });
    renderSubjectTab(tab);
}

// Tab 渲染分发：刷新/看门狗/切回窗口时按 currentSubjectTab 重渲染，保持用户所在 Tab
function renderSubjectTab(tab) {
    const box = document.getElementById('subject-tab-content');
    if (!box) return;
    const tabNames = { report: '报告', plan: '课程规划', scores: '成绩', logs: '沟通日志' };
    if (tab === 'report' && currentSubjectId) {
        renderReportTab();
    } else if (tab === 'scores' && currentSubjectId) {
        renderScoresTab();
    } else if (tab === 'plan' && currentSubjectId) {
        renderPlanTab();
    } else if (tab === 'logs' && currentSubjectId) {
        renderLogsTab();
    } else {
        box.innerHTML =
            `<p class="text-gray-300 text-center py-10">「${tabNames[tab]}」功能将在后续版本实现</p>`;
    }
}

/* ============================================================
 * 课程规划 Tab（P6 F6.6-F6.8）
 * ============================================================ */
let planList = [];
let planActive = null;      // 当前 active 版本
let planRows = [];          // 表格当前数据
let planTeachers = [];
let planBusy = false;

async function renderPlanTab() {
    const box = document.getElementById('subject-tab-content');
    if (!box) return;
    // 先快照用户未保存的输入，重渲染后恢复（刷新/切回窗口/手动刷新触发时打字不丢）
    const snap = snapshotPlanInputsTab();
    box.innerHTML = '<p class="text-gray-300 text-center py-10">加载中...</p>';
    await loadPlanData();
    if (!box.isConnected) return;   // 导航走开则放弃渲染
    drawPlanTab();
    if (snap) restorePlanInputsTab(snap);
}

async function loadPlanData() {
    try {
        const [pr, tr] = await Promise.all([
            API.plans.list(currentSubjectId),
            API.teachers.list(),
        ]);
        planList = (pr.success && pr.data) ? pr.data : [];
        planTeachers = (tr.success && tr.data) ? tr.data : [];
    } catch (e) { planList = []; planTeachers = []; }
    planActive = planList.find(p => p.status === 'active') || planList[0] || null;
    planRows = planActive ? safeParse(planActive.plan_json, []) : [];
    if (!Array.isArray(planRows)) planRows = [];
}

function drawPlanTab(preserveInputs = true) {
    const box = document.getElementById('subject-tab-content');
    if (!box) return;
    // 快照当前输入（含未保存编辑），重渲染后恢复
    // preserveInputs=false：planRows 被程序整体替换（如 AI 调整载入）时不回填旧值，否则旧 DOM 会把新值盖掉
    const snap = preserveInputs ? snapshotPlanInputsTab() : null;
    box.innerHTML = buildPlanHtml();
    if (snap) restorePlanInputsTab(snap);
}

function buildPlanHtml() {
    if (!planActive) {
        return `<div class="text-center py-12">
            <div class="text-gray-400 text-sm mb-3">暂无课程规划。点击下方按钮开始对话采集，完成后即可生成含课程规划的报告。</div>
            <button onclick="generateSubjectReport()" class="btn-primary" style="padding:8px 18px;"><svg class="icon icon--md"><use href="#icon-message-circle"/></svg> 重新对话采集</button>
        </div>`;
    }
    const commonTid = planRows.length && planRows.every(r => r.teacher_id === planRows[0].teacher_id)
        ? planRows[0].teacher_id : '';
    return `
        <div id="plan-tab">
            <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-700 text-sm inline-flex items-center gap-1.5"><svg class="icon icon--md text-indigo-500"><use href="#icon-calendar"/></svg> 课程规划</span>
                    <span class="badge badge--info">v${planActive.version}</span>
                    <span class="text-xs text-gray-400">${Utils.formatDate(planActive.created_at, true)}</span>
                    ${planActive.status === 'active' ? '<span class="badge badge--success">当前</span>' : ''}
                </div>
                <div class="flex gap-2 flex-wrap">
                    <button onclick="runPlanAdjust()" class="btn-primary" style="padding:6px 14px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-bot"/></svg> AI 课程调整</button>
                    <button onclick="showPlanVersions()" class="btn-outline" style="padding:6px 14px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-history"/></svg> 版本历史</button>
                </div>
            </div>
            ${planActive.adjustment_reason ? `<div class="rounded-lg px-3 py-2 mb-3 text-sm bg-amber-50 text-amber-700 inline-flex items-start gap-1.5" style="border-left:4px solid #f59e0b;"><svg class="icon icon--sm flex-shrink-0 mt-0.5"><use href="#icon-lightbulb"/></svg> ${esc(planActive.adjustment_reason)}</div>` : ''}
            <div id="plan-adjust-panel" class="hidden mb-3"></div>
            <div class="flex items-center gap-2 mb-2">
                <span class="text-xs text-gray-500 font-medium inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-graduation-cap"/></svg> 统一指派教师：</span>
                <select id="plan-teacher-all" onchange="assignTeacherAllPlan(this.value)" class="text-sm" style="width:200px;padding:4px 10px;">
                    <option value="">— 不指定 —</option>
                    ${planTeachers.map(t => `<option value="${t.id}" ${t.id == commonTid ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
                </select>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm" style="min-width:720px;">
                    <thead><tr>
                        <th style="width:90px;">课时</th><th>课程内容</th><th style="width:70px;">课时数</th>
                        <th style="width:120px;">教师</th><th style="width:130px;">备注</th><th style="width:40px;"></th>
                    </tr></thead>
                    <tbody id="plan-tbody">
                        ${planRows.map((row, j) => planRowHtmlTab(row, j)).join('') || '<tr><td colspan="6" class="text-center text-gray-400 py-4">暂无课程，点击下方「新增行」</td></tr>'}
                    </tbody>
                </table>
            </div>
            <div class="flex gap-2 mt-3">
                <button onclick="addPlanRowTab()" class="btn-outline" style="padding:5px 14px;font-size:12px;"><svg class="icon icon--md"><use href="#icon-plus"/></svg> 新增行</button>
                <button onclick="savePlanVersion()" class="btn-primary" style="padding:5px 14px;font-size:12px;"><svg class="icon icon--md"><use href="#icon-save"/></svg> 保存为新版本</button>
            </div>
        </div>`;
}

function planRowHtmlTab(row, i) {
    const teacherOpts = ['<option value="">未指派</option>']
        .concat(planTeachers.map(t => `<option value="${t.id}" ${t.id == row.teacher_id ? 'selected' : ''}>${esc(t.name)}</option>`))
        .join('');
    return `
        <tr>
            <td><input data-plan="lesson" data-i="${i}" value="${esc(row.lesson)}" class="w-full" style="min-width:70px;" placeholder="第1课"></td>
            <td><input data-plan="content" data-i="${i}" value="${esc(row.content)}" class="w-full" placeholder="课程内容"></td>
            <td><input data-plan="hours" data-i="${i}" type="number" min="0" value="${row.hours ?? ''}" class="w-full" style="min-width:50px;"></td>
            <td><select data-plan="teacher_id" data-i="${i}" class="w-full">${teacherOpts}</select></td>
            <td><input data-plan="notes" data-i="${i}" value="${esc(row.notes)}" class="w-full" style="min-width:100px;"></td>
            <td><button onclick="deletePlanRowTab(${i})" class="icon-btn icon-btn--danger" title="删除该行"><svg class="icon"><use href="#icon-trash-2"/></svg></button></td>
        </tr>`;
}

function snapshotPlanInputsTab() {
    const snap = {};
    document.querySelectorAll('#plan-tab [data-plan]').forEach(el => {
        snap[el.dataset.plan + '_' + el.dataset.i] = el.value;
    });
    return snap;
}
function restorePlanInputsTab(snap) {
    document.querySelectorAll('#plan-tab [data-plan]').forEach(el => {
        const v = snap[el.dataset.plan + '_' + el.dataset.i];
        if (v !== undefined) el.value = v;
    });
}

function collectPlanRowsTab() {
    const inputs = document.querySelectorAll('#plan-tab [data-plan]');
    if (!inputs.length) return [];
    let maxI = -1;
    inputs.forEach(el => { const n = parseInt(el.dataset.i); if (n > maxI) maxI = n; });
    const rows = [];
    for (let i = 0; i <= maxI; i++) {
        const q = k => document.querySelector(`#plan-tab [data-plan="${k}"][data-i="${i}"]`);
        const lesson = q('lesson')?.value?.trim() || '';
        const content = q('content')?.value?.trim() || '';
        if (!lesson && !content) continue; // 跳过空行
        const tidRaw = q('teacher_id')?.value;
        const tid = tidRaw && tidRaw !== '' ? parseInt(tidRaw) : null;
        const teacherName = tid && planTeachers.length
            ? (planTeachers.find(t => t.id === tid)?.name || '') : '';
        rows.push({
            lesson,
            content,
            hours: q('hours')?.value !== '' ? Number(q('hours')?.value) : null,
            teacher_id: tid,
            teacher_name: teacherName,
            schedule: q('schedule')?.value?.trim() || '',
            notes: q('notes')?.value?.trim() || '',
        });
    }
    return rows;
}

function addPlanRowTab() {
    const maxLesson = planRows.reduce((m, r) => {
        const n = parseInt(r.lesson);
        return !isNaN(n) && n > m ? n : m;
    }, 0);
    planRows.push({ lesson: `第${maxLesson + 1}课`, content: '', hours: null, teacher_id: null, teacher_name: '', schedule: '', notes: '' });
    drawPlanTab();
}

function deletePlanRowTab(i) {
    if (!planRows.length) return;
    planRows.splice(i, 1);
    drawPlanTab();
}

function assignTeacherAllPlan(tid) {
    const teacher = planTeachers.find(t => t.id == tid);
    const newTid = tid ? parseInt(tid) : null;
    // 直接更新每行教师下拉值：不重渲染，既不被 drawPlanTab 快照把新值盖回，
    // 也不会丢用户在内容/课时等字段里的未保存编辑
    document.querySelectorAll('#plan-tab [data-plan="teacher_id"]').forEach(sel => {
        sel.value = tid ? String(tid) : '';
    });
    planRows.forEach(row => {
        row.teacher_id = newTid;
        row.teacher_name = teacher ? teacher.name : '';
    });
    showToast(newTid ? `已统一指派教师：${teacher ? teacher.name : ''}` : '已清除教师指派', 'success');
}

async function savePlanVersion() {
    if (planBusy) return;
    const rows = collectPlanRowsTab();
    if (!rows.length) { showToast('课程规划不能为空', 'error'); return; }
    Utils.showModal({
        title: '保存为新版本',
        subtitle: '每次保存生成一个新版本（归档当前版本），便于后续回退',
        fields: [{ key: 'reason', label: '调整原因（必填）', type: 'textarea', rows: 2, required: true, placeholder: '如：月考后针对函数薄弱点增加课时' }],
        onSubmit: async (data) => {
            planBusy = true;
            showToast('正在保存…', 'info');
            try {
                const r = await API.plans.save(currentSubjectId, { plan_json: rows, adjustment_reason: data.reason });
                if (!r.success) throw new Error(r.error);
                showToast(`已保存为 v${r.data.version}`, 'success');
                renderPlanTab();
            } catch (e) { showToast('保存失败：' + e.message, 'error'); }
            finally { planBusy = false; }
        },
    });
}

async function runPlanAdjust() {
    if (planBusy) { showToast('AI 正在调整中，请稍候…', 'info'); return; }
    if (!planActive) { showToast('暂无课程规划，请先生成报告', 'error'); return; }
    planBusy = true;
    // 加载占位：spinner + 文案，避免长时间空白让用户以为没反应
    const panel = document.getElementById('plan-adjust-panel');
    if (panel) {
        panel.classList.remove('hidden');
        panel.innerHTML = `<div class="flex items-center gap-2 text-sm text-indigo-600 py-1">
            <svg class="icon icon--md icon-spin"><use href="#icon-loader"/></svg>
            AI 正在调整课程规划，可能需要 10-60 秒，请稍候…
        </div>`;
    }
    showToast('AI 正在调整课程规划，请稍候…', 'info');
    try {
        const r = await API.plans.adjust(currentSubjectId);
        if (!r.success) throw new Error(r.error);
        planRows = r.data.proposed_plan || [];
        const a = r.data.analysis || {};
        const panelHtml = `
            <div class="rounded-lg border p-3" style="border-color:#f59e0b;background:#fffbeb;">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="font-semibold text-sm text-amber-700 inline-flex items-center gap-1"><svg class="icon icon--md"><use href="#icon-bot"/></svg> AI 调整建议已载入表格（尚未保存）</span>
                    ${a && a.trend ? `<span class="badge badge--warning">趋势：${esc(a.trend)}</span>` : ''}
                </div>
                ${r.data.reason ? `<p class="text-sm text-amber-800 mb-1 inline-flex items-center gap-1"><svg class="icon icon--sm"><use href="#icon-lightbulb"/></svg> 调整原因：${esc(r.data.reason)}</p>` : ''}
                <p class="text-xs text-amber-600">请核对下方表格，确认后点「保存为新版本」；不保存则切换离开后丢弃。</p>
            </div>`;
        drawPlanTab(false);   // planRows 已整体替换为 AI 建议，不恢复旧值；先重建 DOM 再填充面板
        const panel2 = document.getElementById('plan-adjust-panel');
        if (panel2) {
            panel2.classList.remove('hidden');
            panel2.innerHTML = panelHtml;
        }
        showToast('AI 调整建议已载入，请核对后保存为新版本', 'success');
    } catch (e) {
        showToast('调整失败：' + e.message, 'error');
    } finally {
        planBusy = false;
    }
}

async function showPlanVersions() {
    if (!planList.length) { showToast('暂无课程规划', 'info'); return; }
    const html = planList.map(v => `
        <div class="flex items-center justify-between py-2 border-b" style="border-color:var(--border-soft);">
            <div class="min-w-0">
                <span class="font-medium text-gray-700">v${v.version}</span>
                <span class="ml-2 text-xs text-gray-400">${Utils.formatDate(v.created_at, true)}</span>
                ${v.status === 'active'
                    ? '<span class="ml-2 badge badge--success">当前</span>'
                    : '<span class="ml-2 badge badge--neutral">已归档</span>'}
                ${v.adjustment_reason ? `<div class="text-xs text-gray-400 truncate mt-0.5 inline-flex items-center gap-0.5" style="max-width:260px;"><svg class="icon icon--sm"><use href="#icon-lightbulb"/></svg> ${esc(v.adjustment_reason)}</div>` : ''}
            </div>
            <div class="flex gap-1 shrink-0">
                <button onclick="previewPlanVersion(${v.id})" class="btn-outline" style="padding:4px 10px;font-size:12px;">预览</button>
                ${v.status !== 'active' ? `<button onclick="rollbackPlan(${v.id}, ${v.version})" class="btn-outline" style="padding:4px 10px;font-size:12px;">回退</button>` : ''}
            </div>
        </div>`).join('');
    Utils.showModal({
        title: '课程规划版本历史',
        subtitle: `${planList.length} 个版本 · 回退会复制所选版本为新版本`,
        width: 620,
        hideOk: true,
        bodyHtml: html || '<p class="text-gray-400 text-center py-6">暂无版本</p>',
    });
}

async function previewPlanVersion(planId) {
    const v = planList.find(p => p.id === planId);
    if (!v) { showToast('规划不存在', 'error'); return; }
    const rows = safeParse(v.plan_json, []);
    const html = `<div class="text-sm">` + (Array.isArray(rows) ? rows.map(r => `
        <div class="py-2 border-b" style="border-color:var(--border-soft);">
            <span class="font-medium">${esc(r.lesson)}</span>
            <span class="ml-2 text-gray-600">${esc(r.content)}</span>
            <span class="ml-2 text-xs text-gray-400">${r.hours ?? ''}课时</span>
            <span class="ml-2 text-xs text-gray-400">${esc(r.teacher_name || '')}</span>
        </div>`).join('') : '') + `</div>`;
    Utils.showModal({ title: `规划 v${v.version} 预览`, width: 600, hideOk: true, bodyHtml: html });
}

function rollbackPlan(planId, version) {
    const v = planList.find(p => p.id === planId);
    if (!v) return;
    Utils.confirmDialog({
        title: '回退课程规划',
        message: `将 v${version} 的内容复制为新版本（当前版本保持归档），确认回退？`,
        onOk: async () => {
            planBusy = true;
            try {
                const r = await API.plans.save(currentSubjectId, {
                    plan_json: safeParse(v.plan_json, []),
                    adjustment_reason: `回退到 v${version}`,
                });
                if (!r.success) throw new Error(r.error);
                showToast(`已回退并生成 v${r.data.version}`, 'success');
                renderPlanTab();
            } catch (e) { showToast('回退失败：' + e.message, 'error'); }
            finally { planBusy = false; }
        },
    });
}

/* ============================================================
 * 沟通日志 Tab（P7 F7.2）
 * ============================================================ */
let logsList = [];

async function renderLogsTab() {
    const box = document.getElementById('subject-tab-content');
    if (!box) return;
    box.innerHTML = '<p class="text-gray-300 text-center py-10">加载中...</p>';
    try {
        const r = await API.commLogs.list(currentSubjectId);
        logsList = (r.success && r.data) ? r.data : [];
    } catch (e) { logsList = []; }
    if (!box.isConnected) return;   // 导航走开则放弃渲染
    box.innerHTML = buildLogsHtml();
}

function buildLogsHtml() {
    const listHtml = logsList.length ? logsList.map(l => `
        <div class="flex items-start justify-between gap-4 py-3" style="border-bottom:1px solid #f1f5f9;">
            <div class="flex-1">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="badge ${methodCls(l.method)}">${esc(l.method)}</span>
                    <span class="text-xs text-gray-400">${Utils.formatDate(l.log_time)}${l.log_time && l.log_time.length > 10 ? ' ' + esc(l.log_time.slice(11, 16)) : ''}</span>
                </div>
                <div class="text-sm text-gray-700" style="white-space:pre-wrap;">${esc(l.content)}</div>
            </div>
            <div class="flex gap-1 flex-shrink-0">
                <button onclick="editLog(${l.id})" class="icon-btn" title="编辑"><svg class="icon"><use href="#icon-pencil"/></svg></button>
                <button onclick="deleteLog(${l.id})" class="icon-btn icon-btn--danger" title="删除"><svg class="icon"><use href="#icon-trash-2"/></svg></button>
            </div>
        </div>`).join('')
        : `<div class="empty-state">
            <div class="empty-icon"><svg class="icon"><use href="#icon-notebook-pen"/></svg></div>
            <div class="empty-title">暂无沟通记录</div>
            <div class="empty-desc">与家长/学生沟通后，点右上角「记录沟通」留痕</div>
        </div>`;
    return `
        <div id="logs-tab">
            <div class="flex items-center justify-between mb-2">
                <div class="text-xs text-gray-400">共 ${logsList.length} 条记录，按时间倒序</div>
                <button onclick="showAddLogModal()" class="btn-primary" style="padding:6px 14px;font-size:13px;"><svg class="icon icon--md"><use href="#icon-plus"/></svg> 记录沟通</button>
            </div>
            <div>${listHtml}</div>
        </div>`;
}

function methodCls(m) {
    const map = { '电话': 'badge--info', '微信': 'badge--success', '面谈': 'badge--violet' };
    return map[m] || 'badge--neutral';
}

function showAddLogModal(editId) {
    let values = {};
    if (editId) {
        const l = logsList.find(x => x.id === editId);
        if (l) {
            values = {
                log_time: (l.log_time || '').slice(0, 10),
                method: l.method,
                content: l.content,
            };
        }
    } else {
        values = { log_time: new Date().toISOString().slice(0, 10), method: '面谈' };
    }
    Utils.showModal({
        title: editId ? '编辑沟通记录' : '记录沟通',
        subtitle: '记录一次与家长/学生的沟通',
        width: 560,
        fields: [
            { key: 'log_time', label: '沟通时间', type: 'date', required: true },
            { key: 'method', label: '沟通方式', type: 'select', options: [{ v: '面谈', label: '面谈' }, { v: '电话', label: '电话' }, { v: '微信', label: '微信' }, { v: '其他', label: '其他' }] },
            { key: 'content', label: '内容摘要', type: 'textarea', rows: 4, required: true, placeholder: '沟通要点、家长反馈、学员状态、约定事项...' },
        ],
        values,
        onSubmit: async (data) => {
            if (!data.log_time) data.log_time = new Date().toISOString().slice(0, 10);
            try {
                const r = editId
                    ? await API.commLogs.update(editId, data)
                    : await API.commLogs.create(currentSubjectId, data);
                if (r.success) { showToast(editId ? '记录已更新' : '已记录', 'success'); renderLogsTab(); }
                else showToast('保存失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('保存失败：' + e.message, 'error'); }
        },
    });
}

function editLog(id) { showAddLogModal(id); }

function deleteLog(id) {
    const l = logsList.find(x => x.id === id);
    Utils.confirmDialog({
        title: '删除沟通记录',
        message: '确定删除这条沟通记录？',
        danger: true,
        onOk: async () => {
            try {
                const r = await API.commLogs.delete(id);
                if (r.success) { showToast('已删除', 'success'); renderLogsTab(); }
                else showToast('删除失败：' + (r.error || '未知错误'), 'error');
            } catch (e) { showToast('删除失败：' + e.message, 'error'); }
        },
    });
}

function refreshStudentDetail() {
    loadStudentOverview();

        document.getElementById('subject-detail-area').classList.remove('hidden');

    }
}
// 注册全局刷新（顶部「↻ 刷新」按钮 / 切回标签页自动调用）
window.currentPageRefresh = refreshStudentDetail;

loadStudentOverview();
if (routeSubjectId) {
    document.getElementById('subject-detail-area').classList.remove('hidden');
    document.getElementById('back-to-overview').classList.remove('hidden');
    renderSubjectTab('report');  // 首次进入默认报告 Tab
}

/* ---------- 学科切换（修 bug：同一 subject 路由内参数变化时组件不重挂载，手动响应） ----------
 * #/student/2/subject/3 → #/student/2/subject/4 是同一路由记录，Vue Router 复用组件实例，
 * 页面脚本不会重跑，需监听 hashchange 检测 sid 变化并重新初始化学科详情区。
 */
function onSubjectHashChange() {
    const parts = location.hash.split('/');
    if (!(parts[1] === 'student' && parts[3] === 'subject' && parts[4])) return;
    const sid = parseInt(parts[4]);
    if (!sid || sid === currentSubjectId) return;
    currentSubjectId = sid;
    goalPercent = null;   // 切换学科后重置目标参考线（避免上一学科的线带到新学科）
    if (overviewData && Array.isArray(overviewData.subjects)) renderSubjectCards(overviewData);  // 移动学科卡高亮
    document.getElementById('subject-detail-area').classList.remove('hidden');
    document.getElementById('back-to-overview').classList.remove('hidden');
    renderSubjectTab(currentSubjectTab);   // 保留用户当前所在 Tab
}
window.addEventListener('hashchange', onSubjectHashChange);

/* ---------- 页面卸载钩子（app.js unmounted 调用）：释放 ECharts 实例 + resize 监听 ---------- */
window.addEventListener('resize', onScoreChartResize);
window.__pageUnmounted = function () {
    disposeScoreChart();
    window.removeEventListener('resize', onScoreChartResize);
    window.removeEventListener('hashchange', onSubjectHashChange);
    window.__pageUnmounted = null;
};

/* ---------- IIFE 作用域导出：供内联 onclick/onchange 调用 ---------- */
Object.assign(window, {
    changeStudentStatus, deleteStudent, editStudentInfo, toggleSubject,
    generateSubjectReport, refreshStudentDetail, selectSubject,
    showAddSubjectModal, switchSubjectTab, createClassFromSubject,
    // P5 总览
    loadStudentOverview, backToOverview,
    // 报告删除 + 档案 AI 助手
    deleteReport, openStudentChat, sendStudentChat,
    // P6 成绩 Tab
    showAddScoreModal, showBatchScoreModal, runScoreAnalysis, setScoreChartMode, editScore, deleteScore,
    // P6 规划 Tab
    renderPlanTab, addPlanRowTab, deletePlanRowTab, savePlanVersion, assignTeacherAllPlan,
    showPlanVersions, previewPlanVersion, rollbackPlan, runPlanAdjust,
    // P7 沟通日志 Tab
    renderLogsTab, showAddLogModal, editLog, deleteLog,
});
})();
</script>
