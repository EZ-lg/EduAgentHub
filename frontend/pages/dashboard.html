<!-- 工作台看板 — P9：统计卡片 + 趋势图表 + 学科分布 + 学生看板 + 最近活动 -->
<div class="fade-in">
    <!-- 统计卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-6" style="min-width:0;">
        <div class="stat-card">
            <div class="stat-icon stat-icon--blue"><svg class="icon"><use href="#icon-users"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-active-students">0</div>
                <div class="stat-label">在读学生</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--violet"><svg class="icon"><use href="#icon-book-open"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-active-subjects">0</div>
                <div class="stat-label">活跃学科</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--pink"><svg class="icon"><use href="#icon-user-plus"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-new-students">0</div>
                <div class="stat-label">本月新增</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--amber"><svg class="icon"><use href="#icon-graduation-cap"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-teachers">0</div>
                <div class="stat-label">教师数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--red"><svg class="icon"><use href="#icon-file-text"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-pending">0</div>
                <div class="stat-label">草稿报告</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--green"><svg class="icon"><use href="#icon-database"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-total-students">0</div>
                <div class="stat-label">总学生数</div>
            </div>
        </div>
    </div>

    <!-- 快捷操作 -->
    <div class="flex gap-3 mb-6 flex-wrap">
        <a href="#/students" class="btn-primary" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-plus"/></svg> 新建学生</a>
        <a href="#/teachers" class="btn-outline" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-graduation-cap"/></svg> 教师管理</a>
        <a href="#/knowledge-base" class="btn-outline" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-book-open"/></svg> 知识库</a>
    </div>

    <!-- 图表行 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div class="panel">
            <div class="panel-title"><svg class="icon"><use href="#icon-trending-up"/></svg> 近 6 个月新增学生</div>
            <div id="trend-chart" style="height:220px;"></div>
        </div>
        <div class="panel">
            <div class="panel-title"><svg class="icon"><use href="#icon-pie-chart"/></svg> 学科分布（活跃学科）</div>
            <div id="dist-chart" style="height:220px;"></div>
        </div>
    </div>

    <!-- 学生看板 + 最近活动 -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4" style="align-items:start;">
        <div class="panel" style="grid-column:span 1;">
            <div class="panel-title mb-3"><svg class="icon"><use href="#icon-users"/></svg> 学生看板</div>
            <div id="board-columns" class="grid grid-cols-3 gap-3">
                <div class="col-span-3 text-center py-6 text-gray-300 text-sm">加载中...</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title"><svg class="icon"><use href="#icon-pin"/></svg> 最近活动</div>
            <div class="text-sm" id="activity-list">
                <div class="empty-state py-8">
                    <div class="empty-icon"><svg class="icon"><use href="#icon-inbox"/></svg></div>
                    <div class="empty-title">暂无活动记录</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
let trendChart = null, distChart = null;

const STATUS_COLUMNS = [
    { key: 'active', label: '在读', color: '#10b981' },
    { key: 'completed', label: '已结课', color: '#64748b' },
    { key: 'abandoned', label: '已放弃', color: '#ef4444' },
];
const CHART_COLORS = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b'];

function esc(s) { return Utils.escapeHtml(String(s ?? '')); }

/* ---------- 统计卡片 ---------- */
function renderStats(d) {
    document.getElementById('stat-active-students').textContent = d.active_students || 0;
    document.getElementById('stat-active-subjects').textContent = d.active_subjects || 0;
    document.getElementById('stat-new-students').textContent = d.new_students_this_month || 0;
    document.getElementById('stat-teachers').textContent = d.teachers || 0;
    document.getElementById('stat-pending').textContent = d.pending_reports || 0;
    document.getElementById('stat-total-students').textContent = d.total_students || 0;
}

/* ---------- 图表 ---------- */
function renderCharts(trend, dist) {
    if (typeof echarts === 'undefined') return;
    const trendEl = document.getElementById('trend-chart');
    const distEl = document.getElementById('dist-chart');

    if (trendChart) trendChart.dispose();
    if (trendEl) {
        trendChart = echarts.init(trendEl);
        trendChart.setOption({
            grid: { left: 34, right: 12, top: 20, bottom: 26 },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            xAxis: { type: 'category', data: trend.map(t => t.label),
                axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#94a3b8', fontSize: 11 } },
            yAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: '#f1f5f9' } },
                axisLabel: { color: '#94a3b8', fontSize: 11 } },
            series: [{ type: 'bar', data: trend.map(t => t.count), barWidth: '45%',
                itemStyle: { color: '#4f46e5', borderRadius: [4, 4, 0, 0] } }],
        });
    }

    if (distChart) distChart.dispose();
    if (distEl) {
        distChart = echarts.init(distEl);
        const data = dist.map((d, i) => ({
            name: d.name, value: d.value,
            itemStyle: { color: CHART_COLORS[i % CHART_COLORS.length] },
        }));
        distChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} 门 ({d}%)' },
            legend: { bottom: 0, icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: { color: '#64748b', fontSize: 11 } },
            series: [{
                type: 'pie', radius: ['45%', '68%'], center: ['50%', '42%'],
                itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
                label: { color: '#64748b', fontSize: 11 },
                data: data.length ? data : [{ name: '暂无', value: 1, itemStyle: { color: '#e2e8f0' } }],
            }],
        });
    }
}

/* ---------- 学生看板 ---------- */
function renderBoard(board) {
    const box = document.getElementById('board-columns');
    if (!box) return;
    const isEmpty = STATUS_COLUMNS.every(c => !(board[c.key] || []).length);
    if (isEmpty) {
        box.innerHTML = '<div class="col-span-3 text-center py-8 text-gray-300 text-sm">暂无学生，先去「学生档案」新建吧</div>';
        return;
    }
    box.innerHTML = STATUS_COLUMNS.map(col => {
        const items = board[col.key] || [];
        return `<div class="bg-white rounded-lg p-3" style="border:1px solid #f1f5f9;">
            <div class="text-xs font-semibold mb-2 flex items-center gap-1.5 text-gray-600">
                <span class="w-2 h-2 rounded-full" style="background:${col.color};"></span>
                ${col.label}
                <span class="text-gray-300 font-normal num">${items.length}</span>
            </div>
            <div class="space-y-2" style="max-height:340px;overflow-y:auto;">
                ${items.length ? items.map(cardHtml).join('') : '<div class="text-xs text-gray-300 text-center py-3">暂无</div>'}
            </div>
        </div>`;
    }).join('');
}

function cardHtml(s) {
    return `<div onclick="location.hash='#/student/${s.id}'" class="bg-white rounded-lg p-3 cursor-pointer transition hover:shadow-md" style="border:1px solid #f1f5f9;">
        <div class="text-sm font-medium text-gray-800">${esc(s.name)} <span class="text-xs font-normal text-gray-400">${esc(s.grade || '')}</span></div>
        <div class="mt-1.5 flex flex-wrap gap-1">
            ${(s.subjects || []).map(x => `<span class="badge badge--info">${esc(x)}</span>`).join('') || '<span class="text-[10px] text-gray-300">未开学科</span>'}
        </div>
        <div class="mt-1.5 text-[10px] text-gray-300">${Utils.formatDate(s.updated_at, true)}</div>
    </div>`;
}

/* ---------- 最近活动 ---------- */
function renderActivities(list) {
    const box = document.getElementById('activity-list');
    if (!box) return;
    if (!list || !list.length) {
        box.innerHTML = `<div class="empty-state py-8">
            <div class="empty-icon"><svg class="icon"><use href="#icon-inbox"/></svg></div>
            <div class="empty-title">暂无活动记录</div></div>`;
        return;
    }
    box.innerHTML = list.map(a => {
        const who = a.student_name
            ? `<span class="font-medium text-gray-600">${esc(a.student_name)}</span>${a.subject_name ? `<span class="text-gray-300"> · ${esc(a.subject_name)}</span>` : ''}`
            : '';
        return `<div class="py-2 border-b flex items-center justify-between gap-2" style="border-color:#f8fafc;">
            <div class="text-sm text-gray-500 truncate">
                ${who ? who + ' — ' : ''}${esc(a.action)}<span class="text-gray-300 text-xs ml-1">${esc(a.detail)}</span>
            </div>
            <div class="text-gray-300 text-xs shrink-0 num">${Utils.formatDate(a.created_at, true)}</div>
        </div>`;
    }).join('');
}

/* ---------- 主流程 ---------- */
async function loadDashboard() {
    let stats = {}, board = {}, trend = [], dist = [], acts = [];
    try {
        const r = await API.dashboard.stats();
        if (r.success) stats = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.board();
        if (r.success) board = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.trend();
        if (r.success) trend = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.subjectDist();
        if (r.success) dist = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.activities();
        if (r.success) acts = r.data;
    } catch (e) { console.error(e); }

    renderStats(stats);
    renderBoard(board);
    renderActivities(acts);
    renderCharts(trend, dist);
}

/* ---------- 图表生命周期安全（页面切换释放，避免泄漏） ---------- */
function onResize() {
    if (trendChart && trendChart.resize) trendChart.resize();
    if (distChart && distChart.resize) distChart.resize();
}
window.addEventListener('resize', onResize);
window.__pageUnmounted = function () {
    if (trendChart) { trendChart.dispose(); trendChart = null; }
    if (distChart) { distChart.dispose(); distChart = null; }
    window.removeEventListener('resize', onResize);
    window.__pageUnmounted = null;
};

// 注册全局刷新（顶部「↻ 刷新」/切回标签页自动调用）
window.currentPageRefresh = loadDashboard;

loadDashboard();
})();
</script>
