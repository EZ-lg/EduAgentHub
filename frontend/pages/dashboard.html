<!-- 全局总览 — 2.0 P5 G4/G5：统计条 + 待办区 + 学生卡片流 + 可选趋势图表 -->
<div class="fade-in">
    <!-- 统计条 -->
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-6" style="min-width:0;">
        <div class="stat-card">
            <div class="stat-icon stat-icon--blue"><svg class="icon"><use href="#icon-users"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-active-students">0</div>
                <div class="stat-label">在读学生</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--violet"><svg class="icon"><use href="#icon-clipboard-list"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-active-classes">0</div>
                <div class="stat-label">活跃班级</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--pink"><svg class="icon"><use href="#icon-calendar"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-weekly-sessions">0</div>
                <div class="stat-label">本周课次</div>
            </div>
        </div>
        <div class="stat-card" style="position:relative;">
            <div class="stat-icon stat-icon--red"><svg class="icon"><use href="#icon-zap"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-pending">0</div>
                <div class="stat-label">待排课班级</div>
            </div>
            <span class="badge badge--danger" id="stat-pending-badge" style="display:none;position:absolute;top:12px;right:12px;">需处理</span>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--amber"><svg class="icon"><use href="#icon-graduation-cap"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-teachers">0</div>
                <div class="stat-label">教师数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon--green"><svg class="icon"><use href="#icon-database"/></svg></div>
            <div>
                <div class="stat-value num" id="stat-total-students">0</div>
                <div class="stat-label">总学生数</div>
            </div>
        </div>
    </div>

    <!-- 快捷操作 -->
    <div class="flex gap-3 mb-6 flex-wrap">
        <a href="#/students" class="btn-primary" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-plus"/></svg> 新建学生</a>
        <a href="#/classes" class="btn-outline" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-clipboard-list"/></svg> 班级管理</a>
        <a href="#/schedule" class="btn-outline" style="text-decoration:none;"><svg class="icon icon--md"><use href="#icon-calendar"/></svg> 课表</a>
    </div>

    <!-- 待办区 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6" style="align-items:start;">
        <!-- 待排课 -->
        <div class="panel" style="padding:18px 20px;">
            <div class="panel-title mb-3 flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5"><svg class="icon icon--md text-amber-500"><use href="#icon-zap"/></svg> 待排课班级</span>
                <span class="text-xs text-gray-300 num" id="todo-pending-count">0</span>
            </div>
            <div id="todo-pending" class="text-sm">
                <div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-check-circle"/></svg></div><div class="empty-title">全部班级已排课</div></div>
            </div>
        </div>
        <!-- 今日有课 -->
        <div class="panel" style="padding:18px 20px;">
            <div class="panel-title mb-3 flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5"><svg class="icon icon--md text-indigo-500"><use href="#icon-calendar"/></svg> 今日有课</span>
                <span class="text-xs text-gray-300 num" id="todo-today-count">0</span>
            </div>
            <div id="todo-today" class="text-sm">
                <div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-inbox"/></svg></div><div class="empty-title">今日无课</div></div>
            </div>
        </div>
        <!-- 最近活动 -->
        <div class="panel" style="padding:18px 20px;">
            <div class="panel-title mb-3"><span class="inline-flex items-center gap-1.5"><svg class="icon icon--md text-green-600"><use href="#icon-pin"/></svg> 最近活动</span></div>
            <div id="todo-activities" class="text-sm">
                <div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-inbox"/></svg></div><div class="empty-title">暂无活动记录</div></div>
            </div>
        </div>
    </div>

    <!-- 学生卡片流 -->
    <div class="panel">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="panel-title mb-0"><svg class="icon icon--md text-indigo-500"><use href="#icon-users"/></svg> 学生总览 <span class="text-xs font-normal text-gray-400 num" id="student-flow-count"></span></div>
            <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1" id="student-flow-filter">
                <button class="term-btn active" data-sf="active" onclick="setStudentFilter('active')" style="padding:4px 12px;font-size:12px;border-radius:6px;">在读</button>
                <button class="term-btn" data-sf="completed" onclick="setStudentFilter('completed')" style="padding:4px 12px;font-size:12px;border-radius:6px;">已结课</button>
                <button class="term-btn" data-sf="abandoned" onclick="setStudentFilter('abandoned')" style="padding:4px 12px;font-size:12px;border-radius:6px;">已放弃</button>
                <button class="term-btn" data-sf="all" onclick="setStudentFilter('all')" style="padding:4px 12px;font-size:12px;border-radius:6px;">全部</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3" id="student-card-grid">
            <div class="col-span-full text-center py-8 text-gray-300 text-sm">加载中...</div>
        </div>
    </div>

    <!-- 趋势图表（可选区块） -->
    <div class="panel">
        <div class="flex items-center justify-between mb-3">
            <div class="panel-title mb-0"><svg class="icon icon--md text-indigo-500"><use href="#icon-trending-up"/></svg> 数据趋势</div>
            <button onclick="toggleCharts()" class="btn-outline" style="padding:4px 12px;font-size:12px;" id="btn-toggle-charts">
                <svg class="icon icon--sm"><use href="#icon-chevron-down"/></svg> 收起
            </button>
        </div>
        <div id="chart-area">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div>
                    <div class="text-sm text-gray-600 mb-2 inline-flex items-center gap-1.5"><svg class="icon icon--sm"><use href="#icon-trending-up"/></svg> 近 6 个月新增学生</div>
                    <div id="trend-chart" style="height:220px;"></div>
                </div>
                <div>
                    <div class="text-sm text-gray-600 mb-2 inline-flex items-center gap-1.5"><svg class="icon icon--sm"><use href="#icon-pie-chart"/></svg> 学科分布（活跃学科）</div>
                    <div id="dist-chart" style="height:220px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
let trendChart = null, distChart = null;
let studentFlowData = [];      // 后端返回的全部学生卡片
let studentFilter = 'active';  // 当前筛选：active/completed/abandoned/all

const AVATAR_COLORS = ['#4f46e5', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#14b8a6', '#ef4444'];
const CHART_COLORS = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#64748b'];

function esc(s) { return Utils.escapeHtml(String(s ?? '')); }

function avatarColor(name) {
    let sum = 0;
    for (const ch of String(name || '')) sum += ch.charCodeAt(0);
    return AVATAR_COLORS[sum % AVATAR_COLORS.length];
}

const STATUS_TEXT = { active: '在读', completed: '已结课', abandoned: '已放弃' };

/* ---------- 统计条 ---------- */
function renderStats(d) {
    document.getElementById('stat-active-students').textContent = d.active_students || 0;
    document.getElementById('stat-active-classes').textContent = d.active_classes || 0;
    document.getElementById('stat-weekly-sessions').textContent = d.weekly_sessions || 0;
    document.getElementById('stat-pending').textContent = d.pending_schedule || 0;
    document.getElementById('stat-teachers').textContent = d.teachers || 0;
    document.getElementById('stat-total-students').textContent = d.total_students || 0;
    const badge = document.getElementById('stat-pending-badge');
    if (badge) badge.style.display = d.pending_schedule > 0 ? '' : 'none';
}

/* ---------- 待办区 ---------- */
function renderTodos(todos) {
    renderPending(todos.pending_schedule || []);
    renderToday(todos.today_classes || []);
    renderActivities(todos.activities || []);
}

function renderPending(list) {
    document.getElementById('todo-pending-count').textContent = list.length;
    const box = document.getElementById('todo-pending');
    if (!box) return;
    if (!list.length) {
        box.innerHTML = `<div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-check-circle"/></svg></div><div class="empty-title">全部班级已排课</div></div>`;
        return;
    }
    box.innerHTML = list.map(c => `
        <div class="flex items-center justify-between gap-2 py-2 border-b cursor-pointer hover:bg-gray-50 rounded px-1 -mx-1 transition" style="border-color:#f8fafc;" onclick="location.hash='#/classes/${c.id}'">
            <div class="min-w-0">
                <div class="text-sm text-gray-700 font-medium truncate">${esc(c.name)}</div>
                <div class="text-xs text-gray-400 truncate">${esc(c.subject_name || '未设学科')} · ${esc(c.teacher_name || '未指派教师')}</div>
            </div>
            <span class="badge badge--warning shrink-0">去排课</span>
        </div>`).join('');
}

function renderToday(list) {
    document.getElementById('todo-today-count').textContent = list.length;
    const box = document.getElementById('todo-today');
    if (!box) return;
    if (!list.length) {
        box.innerHTML = `<div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-inbox"/></svg></div><div class="empty-title">今日无课</div></div>`;
        return;
    }
    box.innerHTML = list.map(c => `
        <div class="flex items-center justify-between gap-2 py-2 border-b cursor-pointer hover:bg-gray-50 rounded px-1 -mx-1 transition" style="border-color:#f8fafc;" onclick="location.hash='#/schedule'">
            <div class="min-w-0">
                <div class="text-sm text-gray-700 font-medium truncate">${esc(c.name)}</div>
                <div class="text-xs text-gray-400">${esc(c.start_time || '')}-${esc(c.end_time || '')} · ${esc(c.classroom_name || '未设教室')} · ${c.student_count} 人</div>
            </div>
            ${c.term_type === 'summer_winter' ? '<span class="badge badge--warning shrink-0">寒暑假班</span>' : ''}
        </div>`).join('');
}

function renderActivities(list) {
    const box = document.getElementById('todo-activities');
    if (!box) return;
    if (!list || !list.length) {
        box.innerHTML = `<div class="empty-state py-6"><div class="empty-icon" style="width:40px;height:40px;"><svg class="icon"><use href="#icon-inbox"/></svg></div><div class="empty-title">暂无活动记录</div></div>`;
        return;
    }
    box.innerHTML = list.map(a => {
        const who = a.student_name
            ? `<span class="font-medium text-gray-600">${esc(a.student_name)}</span>${a.subject_name ? `<span class="text-gray-300"> · ${esc(a.subject_name)}</span>` : ''}`
            : '';
        return `<div class="py-2 border-b" style="border-color:#f8fafc;">
            <div class="text-sm text-gray-500 truncate">
                ${who ? who + ' — ' : ''}${esc(a.action)}<span class="text-gray-300 text-xs ml-1">${esc(a.detail)}</span>
            </div>
            <div class="text-gray-300 text-xs mt-0.5 num">${Utils.formatDate(a.created_at, true)}</div>
        </div>`;
    }).join('');
}

/* ---------- 学生卡片流 ---------- */
function setStudentFilter(f) {
    studentFilter = f;
    document.querySelectorAll('#student-flow-filter .term-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sf === f);
    });
    renderStudentFlow();
}

function renderStudentFlow() {
    const box = document.getElementById('student-card-grid');
    if (!box) return;
    const list = studentFilter === 'all'
        ? studentFlowData
        : studentFlowData.filter(s => s.status === studentFilter);
    document.getElementById('student-flow-count').textContent = `（${list.length} 人）`;
    if (!list.length) {
        box.innerHTML = `<div class="col-span-full text-center py-8 text-gray-300 text-sm">${studentFilter === 'active' ? '暂无在读学生，先去「学生档案」新建吧' : '该状态暂无学生'}</div>`;
        return;
    }
    box.innerHTML = list.map(s => {
        const repBadge = s.report_status === 'published'
            ? '<span class="badge badge--success">已出报告</span>'
            : (s.report_status === 'draft' ? '<span class="badge badge--neutral">报告草稿</span>' : '<span class="badge badge--neutral" style="opacity:.55;">无报告</span>');
        const subs = (s.subjects || []).slice(0, 3).map(x => `<span class="badge badge--info">${esc(x)}</span>`).join('');
        const more = (s.subjects || []).length > 3 ? `<span class="text-[10px] text-gray-300">+${(s.subjects || []).length - 3}</span>` : '';
        return `<div class="student-card" onclick="location.hash='#/student/${s.id}'">
            <div class="flex items-center gap-3">
                <div class="student-avatar" style="background:${avatarColor(s.name)};">${esc((s.name || '?').charAt(0))}</div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-sm font-semibold text-gray-800 truncate">${esc(s.name)}</span>
                        ${s.grade ? `<span class="text-xs text-gray-400">${esc(s.grade)}</span>` : ''}
                    </div>
                    <div class="text-xs text-gray-400 mt-0.5">${s.subject_count} 学科 · ${s.class_count} 班级 · 本周 ${s.weekly_sessions} 课</div>
                </div>
                <div class="shrink-0">${repBadge}</div>
            </div>
            <div class="mt-2 flex flex-wrap gap-1 items-center">
                ${subs || '<span class="text-[11px] text-gray-300">未开学科</span>'}${more}
            </div>
        </div>`;
    }).join('');
}

/* ---------- 图表 ---------- */
function renderCharts(trend, dist) {
    if (typeof echarts === 'undefined') return;
    const trendEl = document.getElementById('trend-chart');
    const distEl = document.getElementById('dist-chart');

    if (trendChart) trendChart.dispose();
    if (trendEl) {
        trendChart = echarts.init(trendEl);
        trendChart.setOption({
            grid: { left: 34, right: 12, top: 20, bottom: 26 },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            xAxis: { type: 'category', data: trend.map(t => t.label),
                axisLine: { lineStyle: { color: '#e2e8f0' } }, axisLabel: { color: '#94a3b8', fontSize: 11 } },
            yAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: '#f1f5f9' } },
                axisLabel: { color: '#94a3b8', fontSize: 11 } },
            series: [{ type: 'bar', data: trend.map(t => t.count), barWidth: '45%',
                itemStyle: { color: '#4f46e5', borderRadius: [4, 4, 0, 0] } }],
        });
    }

    if (distChart) distChart.dispose();
    if (distEl) {
        distChart = echarts.init(distEl);
        const data = dist.map((d, i) => ({
            name: d.name, value: d.value,
            itemStyle: { color: CHART_COLORS[i % CHART_COLORS.length] },
        }));
        distChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} 门 ({d}%)' },
            legend: { bottom: 0, icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: { color: '#64748b', fontSize: 11 } },
            series: [{
                type: 'pie', radius: ['45%', '68%'], center: ['50%', '42%'],
                itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
                label: { color: '#64748b', fontSize: 11 },
                data: data.length ? data : [{ name: '暂无', value: 1, itemStyle: { color: '#e2e8f0' } }],
            }],
        });
    }
}

function toggleCharts() {
    const area = document.getElementById('chart-area');
    const btn = document.getElementById('btn-toggle-charts');
    if (!area) return;
    const hidden = area.classList.toggle('hidden');
    btn.innerHTML = hidden
        ? '<svg class="icon icon--sm"><use href="#icon-chevron-down"/></svg> 展开'
        : '<svg class="icon icon--sm"><use href="#icon-chevron-down"/></svg> 收起';
    if (!hidden) {
        // 重新可见后刷新图表尺寸（隐藏时 init 会拿到 0 宽）
        if (trendChart && trendChart.resize) trendChart.resize();
        if (distChart && distChart.resize) distChart.resize();
    }
}

/* ---------- 主流程 ---------- */
async function loadDashboard() {
    let ov = { stats: {}, students: [], todos: {} };
    let trend = [], dist = [];
    try {
        const r = await API.overview.global();
        if (r.success) ov = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.trend();
        if (r.success) trend = r.data;
    } catch (e) { console.error(e); }
    try {
        const r = await API.dashboard.subjectDist();
        if (r.success) dist = r.data;
    } catch (e) { console.error(e); }

    renderStats(ov.stats || {});
    renderTodos(ov.todos || {});
    studentFlowData = ov.students || [];
    renderStudentFlow();
    renderCharts(trend, dist);
}

/* ---------- 图表生命周期安全 ---------- */
function onResize() {
    if (trendChart && trendChart.resize) trendChart.resize();
    if (distChart && distChart.resize) distChart.resize();
}
window.addEventListener('resize', onResize);
window.__pageUnmounted = function () {
    if (trendChart) { trendChart.dispose(); trendChart = null; }
    if (distChart) { distChart.dispose(); distChart = null; }
    window.removeEventListener('resize', onResize);
    window.__pageUnmounted = null;
};

// 注册全局刷新（顶部「↻ 刷新」/切回标签页自动调用）
window.currentPageRefresh = loadDashboard;

Object.assign(window, {
    setStudentFilter, toggleCharts, loadDashboard,
});

loadDashboard();
})();
</script>
