<!-- 侧边栏导航 — 浅色 64px 图标栏（hover 展开出文字） -->
<nav class="sidebar h-full flex flex-col">
    <!-- Logo -->
    <div class="sidebar-logo-area">
        <div class="flex items-center gap-2.5">
            <span class="logo-badge flex items-center justify-center w-8 h-8 rounded-lg text-white" style="background:linear-gradient(135deg,#6C5CE7,#8B5CF6);">
                <svg class="icon"><use href="#icon-graduation-cap"/></svg>
            </span>
            <span class="sidebar-label">
                <span class="text-[15px] font-bold tracking-wide">教培智能体</span>
                <span class="org-name" id="navbar-org-name">XX教育机构</span>
            </span>
        </div>
    </div>

    <!-- 主导航 -->
    <div class="flex-1 py-3 overflow-y-auto">
        <a href="#/dashboard" data-route="/dashboard" onclick="updateNavActive(this)" title="工作台">
            <svg class="icon"><use href="#icon-layout-dashboard"/></svg><span class="sidebar-label">工作台</span>
        </a>
        <a href="#/students" data-route="/students" onclick="updateNavActive(this)" title="学生档案">
            <svg class="icon"><use href="#icon-users"/></svg><span class="sidebar-label">学生档案</span>
        </a>
        <a href="#/classes" data-route="/classes" onclick="updateNavActive(this)" title="班级管理">
            <svg class="icon"><use href="#icon-clipboard-list"/></svg><span class="sidebar-label">班级管理</span>
        </a>
        <a href="#/schedule" data-route="/schedule" onclick="updateNavActive(this)" title="课表">
            <svg class="icon"><use href="#icon-calendar"/></svg><span class="sidebar-label">课表</span>
        </a>
        <a href="#/teachers" data-route="/teachers" onclick="updateNavActive(this)" title="教师管理">
            <svg class="icon"><use href="#icon-graduation-cap"/></svg><span class="sidebar-label">教师管理</span>
        </a>
        <a href="#/knowledge-base" data-route="/knowledge-base" onclick="updateNavActive(this)" title="知识库">
            <svg class="icon"><use href="#icon-book-open"/></svg><span class="sidebar-label">知识库</span>
        </a>
    </div>

    <!-- 底部：系统设置 + 版本 -->
    <div class="sidebar-footer">
        <a href="#/settings" data-route="/settings" onclick="updateNavActive(this)" title="系统设置" class="mb-0 mx-2" style="margin-bottom:0;">
            <svg class="icon"><use href="#icon-settings"/></svg><span class="sidebar-label">系统设置</span>
        </a>
        <div class="sidebar-label px-2 py-2 text-[11px]" style="color:var(--text-3);">
            <span id="navbar-version">v2.0</span>
        </div>
    </div>
</nav>

<script>
(function() {
    function highlightCurrent() {
        const hash = location.hash || '#/dashboard';
        const basePath = '/' + hash.replace('#/', '').split('/').slice(0, 1).join('/');
        const routeMap = {
            '/dashboard': '/dashboard',
            '/students': '/students', '/student': '/students',
            '/conversation': '/students', '/report': '/students',
            '/teachers': '/teachers',
            '/classes': '/classes', '/schedule': '/schedule',
            '/knowledge-base': '/knowledge-base', '/knowledge': '/knowledge-base',
            '/settings': '/settings',
        };
        const mapped = routeMap[basePath] || basePath;
        document.querySelectorAll('.sidebar a').forEach(a => {
            a.classList.toggle('active', a.dataset.route === mapped);
        });
    }
    window.addEventListener('hashchange', highlightCurrent);
    setTimeout(highlightCurrent, 100);
    window.updateNavActive = function(el) {
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        el.classList.add('active');
    };
})();
</script>
