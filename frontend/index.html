<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教培智能体</title>
    <script>
    // ===== 前端版本自愈机制：每次改动前端代码后递增 APP_VERSION，浏览器自动强制刷新一次 =====
    // 配合后端 no-store 缓存策略，保证用户永远加载到最新代码，无需手动清缓存
    window.APP_VERSION = '28';
    (function () {
        try {
            var saved = localStorage.getItem('ta_app_ver');
            if (saved !== window.APP_VERSION) {
                localStorage.setItem('ta_app_ver', window.APP_VERSION);
                location.reload();
            }
        } catch (e) { /* localStorage 不可用则跳过自愈 */ }
    })();
    // 兼容 bfcache/后台恢复的旧标签页：版本变了自动刷新
    window.addEventListener('pageshow', function (e) {
        try {
            if (e.persisted || localStorage.getItem('ta_app_ver') !== window.APP_VERSION) {
                localStorage.setItem('ta_app_ver', window.APP_VERSION);
                location.reload();
            }
        } catch (err) {}
    });
    </script>
    <!-- Tailwind CSS（本地编译产物，见 build_tailwind.py；改动 class 后需重跑该脚本） -->
    <link rel="stylesheet" href="vendor/tailwind.css?v=28">
    <!-- 本地库（打包/离线可用，均已下载到 vendor/，禁止改回 CDN） -->
    <script src="vendor/vue.global.prod.js?v=28"></script>
    <script src="vendor/vue-router.global.prod.js?v=28"></script>
    <script src="vendor/echarts.min.js?v=28"></script>
    <script src="vendor/jspdf.umd.min.js?v=28"></script>
    <script src="vendor/html2canvas-pro.min.js?v=28"></script>
    <!-- 自定义样式（v 为版本号，改动前端后递增，强制浏览器刷新缓存） -->
    <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body>
    <div id="app">
        <div class="flex h-screen bg-slate-50">
            <!-- 侧边栏 -->
            <div id="navbar-container"></div>

            <!-- 主内容区 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 顶部栏 -->
                <header class="bg-white border-b border-slate-100 px-6 py-3 flex items-center justify-between">
                    <h1 class="text-base font-bold text-slate-800" id="page-title">工作台</h1>
                    <div class="flex items-center gap-4">
                        <button onclick="window.refreshPage && refreshPage()" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-indigo-500 transition" title="刷新当前页面数据">
                            <svg class="icon icon--sm"><use href="#icon-refresh-cw"/></svg> 刷新
                        </button>
                        <div class="text-xs text-slate-400" id="header-info"></div>
                    </div>
                </header>

                <!-- 页面内容 -->
                <main class="flex-1 overflow-auto p-6">
                    <router-view></router-view>
                </main>
            </div>
        </div>
    </div>

    <toast-widget></toast-widget>

    <script src="js/utils.js?v=28"></script>
    <script src="js/api.js?v=28"></script>
    <script src="js/app.js?v=28"></script>
</body>
</html>
