<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教培智能体</title>
    <script>
    // ===== 前端版本自愈机制：每次改动前端代码后递增 APP_VERSION，浏览器自动强制刷新一次 =====
    // 配合后端 no-store 缓存策略，保证用户永远加载到最新代码，无需手动清缓存
    window.APP_VERSION = '21';
    (function () {
        try {
            var saved = localStorage.getItem('ta_app_ver');
            if (saved !== window.APP_VERSION) {
                localStorage.setItem('ta_app_ver', window.APP_VERSION);
                location.reload();
            }
        } catch (e) { /* localStorage 不可用则跳过自愈 */ }
    })();
    // 兼容 bfcache/后台恢复的旧标签页：版本变了自动刷新
    window.addEventListener('pageshow', function (e) {
        try {
            if (e.persisted || localStorage.getItem('ta_app_ver') !== window.APP_VERSION) {
                localStorage.setItem('ta_app_ver', window.APP_VERSION);
                location.reload();
            }
        } catch (err) {}
    });
    </script>
    <!-- Tailwind CSS（本地编译产物，见 build_tailwind.py；改动 class 后需重跑该脚本） -->
    <link rel="stylesheet" href="vendor/tailwind.css?v=21">
    <!-- Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- ECharts 5 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <!-- jsPDF + html2canvas-pro（P5 报告 PDF 导出；pro 版兼容 oklch 颜色） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
    <!-- 自定义样式（v 为版本号，改动前端后递增，强制浏览器刷新缓存） -->
    <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
    <div id="app">
        <div class="flex h-screen bg-gray-50">
            <!-- 侧边栏 -->
            <div id="navbar-container"></div>

            <!-- 主内容区 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 顶部栏 -->
                <header class="bg-white border-b px-6 py-3 flex items-center justify-between" style="border-color: #f1f5f9;">
                    <h1 class="text-base font-bold text-gray-800" id="page-title">工作台</h1>
                    <div class="flex items-center gap-4">
                        <button onclick="window.refreshPage && refreshPage()" class="text-xs text-gray-400 hover:text-blue-500 transition" title="刷新当前页面数据">↻ 刷新</button>
                        <div class="text-xs text-gray-400" id="header-info"></div>
                    </div>
                </header>

                <!-- 页面内容 -->
                <main class="flex-1 overflow-auto p-6">
                    <router-view></router-view>
                </main>
            </div>
        </div>
    </div>

    <toast-widget></toast-widget>

    <script src="js/utils.js?v=21"></script>
    <script src="js/api.js?v=21"></script>
    <script src="js/app.js?v=21"></script>
</body>
</html>
