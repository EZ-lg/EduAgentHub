<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教培智能体</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 -->
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <!-- ECharts 5 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="flex h-screen bg-gray-50">
            <!-- 侧边栏 -->
            <div id="navbar-container"></div>

            <!-- 主内容区 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 顶部栏 -->
                <header class="bg-white border-b px-6 py-3 flex items-center justify-between" style="border-color: #f1f5f9;">
                    <h1 class="text-base font-bold text-gray-800" id="page-title">工作台</h1>
                    <div class="text-xs text-gray-400" id="header-info"></div>
                </header>

                <!-- 页面内容 -->
                <main class="flex-1 overflow-auto p-6">
                    <router-view></router-view>
                </main>
            </div>
        </div>
    </div>

    <toast-widget></toast-widget>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
